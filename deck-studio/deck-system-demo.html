<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<title>Deck System — a presentation engine that lives in one HTML file</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  .deck{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#E9EDF3;overflow:hidden;}
  .deck-inner{width:1600px;height:900px;flex:0 0 auto;position:relative;transform-origin:center center;box-shadow:0 30px 80px rgba(0,0,0,.35);} /* [v5-fix] flex:0 0 auto — 1600px보다 좁은 창에서 flex-shrink로 눌려 슬라이드가 우측 잘림·중앙이탈 되던 버그 수정 */
  .slide{position:absolute;top:0;left:0;width:1600px;height:900px;display:none;overflow:hidden;font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  .slide.active{display:block;animation:slideFade .18s ease;}
  @keyframes slideFade{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.slide.active{animation:none;}}
  .nav{position:fixed;bottom:14px;left:20px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;color:rgba(0,0,0,.3);z-index:99;}
  .hL{position:absolute;top:64px;left:96px;right:96px;display:flex;align-items:center;justify-content:space-between;z-index:8;}
  .orgD{font-size:16px;font-weight:600;letter-spacing:0.08em;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:10px;}
  .orgL{font-size:16px;font-weight:800;color:#0A1334;display:flex;align-items:center;gap:10px;}
  .rlab{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.16em;}
  .dT{position:absolute;top:118px;left:96px;right:96px;height:1px;z-index:8;}
  .fL{position:absolute;bottom:60px;left:96px;right:96px;height:1px;z-index:8;}
  .fT{position:absolute;bottom:28px;left:96px;right:96px;display:flex;justify-content:space-between;z-index:8;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.16em;}
  .eyb{display:flex;align-items:center;gap:12px;}
  .eyb .bar{width:36px;height:4px;background:#3551B5;display:inline-block;}
  .eyb .lab{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.18em;color:#5A6885;}
  .body{position:absolute;top:118px;bottom:96px;left:96px;right:96px;padding-top:36px;display:flex;flex-direction:column;box-sizing:border-box;z-index:2;}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px;}
  .rowline{display:flex;align-items:center;gap:28px;padding:20px 4px;border-top:1px solid #E8ECF3;}
  .term{background:#0A1334;border-radius:14px;box-shadow:0 26px 64px -28px rgba(10,19,52,.5),0 4px 14px -6px rgba(10,19,52,.2);overflow:hidden;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
  .term .bar2{display:flex;align-items:center;gap:7px;padding:12px 16px;background:#141F45;}
  .term .dot{width:11px;height:11px;border-radius:50%;}
  /* ── TUI 타이핑 애니메이션(부가 레이어) ── 기본 상태는 항상 전문 표시, JS가 있을 때만 잠깐 숨겼다 재생 */
  .tuiT{transition:opacity .3s ease;}
  .tuiThink{display:none;align-items:center;gap:3px;color:#93C5FD;margin:8px 0;}
  .tuiThink.tuiThinkOn{display:flex;}
  .tuiThink .tuiDot{display:inline-block;opacity:.25;animation:tuiDotPulse 1s ease-in-out infinite;}
  .tuiThink .tuiDot:nth-child(3){animation-delay:.15s;}
  .tuiThink .tuiDot:nth-child(4){animation-delay:.3s;}
  @keyframes tuiDotPulse{0%,100%{opacity:.25;}50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .tuiThink .tuiDot{animation:none !important;opacity:1 !important;}
  }
  /* ── 등장 애니메이션(부가 레이어, 2026-07-04 추가) ── 기본 상태는 항상 전문 표시.
     JS가 정상 동작할 때만 슬라이드 진입 순간 잠깐 숨겼다 순차/카운트업으로 재생.
     render()를 한 번 더 감싸서 훅을 걸며, TUI 엔진·발표자 모드 코드는 전혀 건드리지 않는다. */
  .rvItem{transition:opacity .45s ease, transform .45s ease;}
  .rvCount{font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: reduce){
    .rvItem{transition:none !important;}
  }
  @media print{
    .rvItem{opacity:1 !important;transform:none !important;}
  }
  @media print{
    .slide.active{animation:none !important;}
    .tuiThink{display:none !important;}
    .tuiT{opacity:1 !important;}
    @page{size:1600px 900px;margin:0;}
    html,body{background:#E9EDF3;}
    .deck{display:block;width:auto;height:auto;background:#E9EDF3;}
    .deck-inner{position:static;transform:none !important;width:1600px;height:auto;box-shadow:none;}
    .slide{position:relative !important;display:block !important;width:1600px;height:900px;page-break-after:always;break-after:page;box-shadow:none;}
    .slide:last-of-type{page-break-after:auto;break-after:auto;}
    .nav{display:none !important;}
    #presenterRoot,#popupWarn,#blackoutOverlay,#helpOverlay,.pMiniToast{display:none !important;}
  }
  /* ── 발표자 모드 (Presenter View) ── */
  body.presenter-mode .deck{display:none;}
  body.presenter-mode{background:#0A1334;}
  #presenterRoot{position:fixed;inset:0;background:#0A1334;color:#fff;display:flex;flex-direction:column;font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:22px;box-sizing:border-box;gap:10px;z-index:10;--thumbW:224px;--nextW:240px;overflow-y:auto;}
  .pTop{display:flex;gap:20px;flex:0 1 220px;min-height:100px;}
  .pCurrentWrap{flex:1;display:flex;flex-direction:column;min-width:0;}
  .pNextWrap{flex:0 0 var(--nextW);display:flex;flex-direction:column;min-width:0;}
  /* ── 좌우 드래그 리사이저: 현재↔다음 슬라이드 폭 비율 조정 ── */
  .pHSplitter{flex:0 0 8px;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:col-resize;border-radius:6px;}
  .pHSplitter:hover,body.pHSplitterDragging .pHSplitter{background:rgba(139,157,239,.14);}
  .pHSplitter span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.32);pointer-events:none;}
  .pHSplitter:hover span,body.pHSplitterDragging .pHSplitter span{background:#8B9DEF;}
  body.pHSplitterDragging{cursor:col-resize;user-select:none;}
  .pTag{font-size:13px;font-weight:700;letter-spacing:.14em;color:#8B9DEF;margin-bottom:8px;text-transform:uppercase;flex:0 0 auto;}
  .pTagKo{letter-spacing:.02em;text-transform:none;}
  /* 현재/다음 슬라이드 박스: 레터박스 제거 — 실제 16:9 크기로 JS가 맞춰줌(updateStage) */
  .pStageOuter{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;}
  .pStage{flex:0 0 auto;background:#000;border-radius:10px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.14);}
  .pStageSmall{opacity:.88;}
  .pDeckInnerClone{width:1600px;height:900px;position:absolute;top:0;left:0;transform-origin:top left;}
  .pBottom{flex:0 0 auto;display:flex;flex-direction:column;gap:12px;}
  /* ── 상하 드래그 리사이저: 위/아래로 끌어 현재슬라이드↔필름스트립 비율 조정 ── */
  .pSplitter{flex:0 0 10px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:row-resize;border-radius:6px;}
  .pSplitter:hover,body.pSplitterDragging .pSplitter{background:rgba(139,157,239,.14);}
  .pSplitter span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.32);pointer-events:none;}
  .pSplitter:hover span,body.pSplitterDragging .pSplitter span{background:#8B9DEF;}
  body.pSplitterDragging{cursor:row-resize;user-select:none;}
  /* ── 필름스트립(전체 흐름): 기본값 = 크게 표시. 상단 영역은 드래그/토글로 조정 ── */
  .pFilmstripWrap{flex:1;display:flex;flex-direction:column;min-height:80px;overflow:hidden;}
  .pFilmstripHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex:0 0 auto;gap:14px;flex-wrap:wrap;}
  .pFilmstripHeaderLeft{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .pSizeCtrl{display:flex;align-items:center;gap:8px;}
  .pSizeLabel{font-size:12px;font-weight:700;letter-spacing:.1em;color:#7A88B8;text-transform:uppercase;white-space:nowrap;}
  .pSizeIcon{font-size:15px;font-weight:700;color:#8B9DEF;line-height:1;user-select:none;}
  #pThumbSize{width:130px;accent-color:#8B9DEF;cursor:pointer;}
  .pToggleBtn{background:#1B2A5E;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;cursor:pointer;}
  .pToggleBtn:hover{background:#243875;}
  .pFilmstrip{flex:1;display:flex;flex-wrap:wrap;gap:10px;overflow-y:auto;overflow-x:hidden;align-content:flex-start;padding:6px;border-radius:10px;background:rgba(255,255,255,.03);min-height:0;}
  .pThumb{position:relative;flex:0 0 auto;width:var(--thumbW);height:calc(var(--thumbW) * 9 / 16);border-radius:8px;overflow:hidden;border:3px solid rgba(255,255,255,.14);background:#000;cursor:pointer;padding:0;}
  .pThumb:hover{border-color:rgba(139,157,239,.6);}
  .pThumb.pThumbCurrent{border-color:#8B9DEF;border-width:4px;box-shadow:0 0 0 4px rgba(139,157,239,.35);}
  .pThumbStage{width:var(--thumbW);height:calc(var(--thumbW) * 9 / 16);position:relative;overflow:hidden;}
  .pThumbNum{position:absolute;left:6px;bottom:5px;font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,.65);border-radius:5px;padding:3px 8px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;pointer-events:none;}
  .pNotesWrap{position:relative;}
  .pNotes{background:#141F45;border-radius:12px;padding:22px 26px;font-size:22px;line-height:1.6;color:#EAF0FF;min-height:70px;max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:keep-all;font-weight:400;}
  .pNotes.pEmpty{color:#8FA3C8;font-style:italic;font-size:18px;}
  /* [개선 18] 노트 글씨 크기 조절 버튼 — hover 시 선명 */
  .pNoteSize{position:absolute;right:14px;top:10px;display:flex;gap:6px;opacity:.5;transition:opacity .15s ease;}
  .pNotesWrap:hover .pNoteSize{opacity:1;}
  .pNoteSize button{background:#1B2A5E;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;cursor:pointer;}
  .pNoteSize button:hover{background:#243875;}
  /* [개선 19] 노트 큐 자동 하이라이트: ⏰ 컷라인=주황 · ⚠️ 주의=빨강 · 백업=파랑 */
  .pCueTime{color:#FFC46B;font-weight:600;}
  .pCueWarn{color:#FF9B9B;font-weight:600;}
  .pCueBackup{color:#8FC6FF;}
  .pControls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .pCounter{font-size:20px;font-weight:700;color:#fff;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  .pTimer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  /* [개선 12] 현재 시각 시계 */
  .pClock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:600;color:#B9C6EF;padding-right:12px;border-right:1px solid rgba(255,255,255,.14);}
  .pTimerDisplay{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:700;color:#8B9DEF;min-width:96px;display:inline-block;}
  /* [개선 13] 타이머 작동 중 초록색으로 상태 표시 */
  .pTimerDisplay.running{color:#7FE0A8;}
  /* [개선 17] 목표 시간 대비 남은 시간 칩 — 5분 전 주황, 초과 빨강 */
  .pTimerRemain{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;font-weight:700;color:#B9C6EF;background:rgba(255,255,255,.06);border-radius:8px;padding:6px 11px;}
  .pTimerRemain.soon{color:#FFC46B;}
  .pTimerRemain.over{color:#fff;background:#C2402A;}
  .pTimer button,.pNav button,.pCtlBtn{background:#1B2A5E;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:10px 16px;font-size:15px;font-weight:600;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;cursor:pointer;}
  .pTimer button:hover,.pNav button:hover,.pCtlBtn:hover{background:#243875;}
  #pTimerToggle.on{background:#1E5A3C;border-color:rgba(127,224,168,.4);}
  /* [개선 16] 리셋 오조작 방지 — 두 번째 확인 상태는 빨강 */
  #pTimerReset.armed{background:#C2402A;border-color:#C2402A;}
  #pTargetInput{width:64px;background:#0F1A40;color:#fff;border:1px solid rgba(139,157,239,.5);border-radius:8px;padding:9px 10px;font-size:15px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  .pNav{display:flex;gap:10px;}
  .pNav button:disabled{opacity:.35;cursor:default;}
  /* [개선 27] 키보드 포커스 링 — 접근성 */
  .pTimer button:focus-visible,.pNav button:focus-visible,.pCtlBtn:focus-visible,.pToggleBtn:focus-visible,.pNoteSize button:focus-visible,.pThumb:focus-visible{outline:2px solid #8B9DEF;outline-offset:2px;}
  /* [개선 21] 진행률 바 */
  #pProgress{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.08);z-index:40;}
  #pProgressFill{height:100%;width:0;background:linear-gradient(90deg,#3551B5,#8B9DEF);transition:width .25s ease;}
  /* [개선 8] 첫 실행 온보딩 배너 */
  #pOnboard{background:#1B2A5E;border:1px solid rgba(139,157,239,.4);border-radius:10px;padding:12px 18px;font-size:15px;line-height:1.5;color:#EAF0FF;display:flex;align-items:center;gap:14px;flex:0 0 auto;}
  #pOnboard strong{color:#B9C6EF;}
  #pOnboard button{margin-left:auto;background:#3551B5;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  /* [개선 9] 강의장 화면 연결 상태 칩 */
  .pConnChip{font-size:13px;font-weight:600;color:#8A96BD;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 13px;white-space:nowrap;}
  .pConnChip.ok{color:#7FE0A8;border-color:rgba(127,224,168,.35);}
  /* [개선 5] 블랙아웃 상태 칩 — 켜져 있는 동안 깜빡여서 잊지 않게 */
  .pBlackChip{font-size:13px;font-weight:700;color:#0A1334;background:#FFC46B;border-radius:999px;padding:6px 13px;white-space:nowrap;animation:pBlink 1.6s ease-in-out infinite;}
  @keyframes pBlink{0%,100%{opacity:1;}50%{opacity:.55;}}
  /* [개선 23] 현재 슬라이드 클릭 네비게이션 */
  .pClickNav{cursor:pointer;}
  .pTagHint{font-weight:500;letter-spacing:0;text-transform:none;color:#8FA3C8;font-size:12px;}
  /* [개선 20] 마지막 슬라이드 카드 — 빈 검정 박스 대신 */
  .pEndCard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700;color:#8B9DEF;background:#101B3F;text-align:center;line-height:1.6;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  /* [개선 22] 노트 있는 슬라이드 ✎ 배지 (필름스트립) */
  .pThumbNoteDot{position:absolute;right:6px;top:5px;font-size:11px;font-weight:700;color:#0A1334;background:#FFC46B;border-radius:5px;padding:2px 6px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;pointer-events:none;}
  /* [개선 5] 블랙아웃 오버레이 (청중 창) */
  #blackoutOverlay{position:fixed;inset:0;z-index:9998;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  #blackoutOverlay.on{opacity:1;pointer-events:auto;cursor:pointer;}
  /* [개선 3·4] 미니 토스트 — 숫자 점프·경계 안내 */
  .pMiniToast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-8px);background:rgba(10,19,52,.92);color:#fff;border:1px solid rgba(139,157,239,.4);padding:10px 20px;border-radius:999px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;}
  .pMiniToast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  /* [개선 7] 단축키 도움말 오버레이 */
  #helpOverlay{position:fixed;inset:0;z-index:9999;background:rgba(4,8,24,.72);display:none;align-items:center;justify-content:center;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;cursor:pointer;backdrop-filter:blur(3px);}
  #helpOverlay.on{display:flex;}
  .pHelpCard{background:#0F1A40;border:1px solid rgba(139,157,239,.35);border-radius:16px;padding:28px 34px;color:#fff;max-width:600px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .pHelpTitle{font-size:19px;font-weight:800;margin-bottom:14px;letter-spacing:.02em;}
  .pHelpCard table{border-collapse:collapse;width:100%;}
  .pHelpCard td{padding:7px 0;font-size:15px;color:#DCE4FA;line-height:1.45;vertical-align:top;}
  .pHelpCard td.pKey{color:#8B9DEF;font-weight:700;padding-right:22px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;}
  .pHelpHint{margin-top:14px;font-size:12.5px;color:#8FA3C8;}
  /* [개선 10] 팝업 차단 안내 + 원클릭 재시도 */
  #popupWarn{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0A1334;color:#fff;padding:14px 22px;border-radius:10px;font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;z-index:9999;box-shadow:0 12px 30px rgba(0,0,0,.35);display:none;max-width:560px;text-align:center;line-height:1.5;}
  #popupWarn button{margin-top:10px;background:#3551B5;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  /* [개선 26] 발표자 모드 버튼 — 기본 선명, 아이들 시에만 숨김 */
  #presenterBtn{position:fixed;right:20px;bottom:16px;z-index:60;background:rgba(10,19,52,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 16px;font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:600;letter-spacing:.03em;cursor:pointer;opacity:.85;transition:opacity .5s ease;}
  #presenterBtn:hover{opacity:1;}
  body.presenter-mode #presenterBtn{display:none;}
  body.presenter-mode .nav{display:none;} /* [v5-CCO] 발표자 창에 청중용 힌트바 노출 방지 */
  @media print{#presenterBtn{display:none !important;}}
  /* [개선 24·25] 청중 창: 4초 아이들 시 하단 힌트·버튼 페이드 + 커서 숨김 */
  .nav{transition:opacity .5s ease;}
  body.uiIdle .nav,body.uiIdle #presenterBtn{opacity:0;pointer-events:none;}
  body.uiIdle:not(.presenter-mode){cursor:none;}
  /* ── 발표자 창 라이트 테마 (☀️ 토글, localStorage 기억) — 밝은 강의장용 ── */
  body.presenter-mode.pLight{background:#F5F8FF;}

  /* ═══ v4 트렌디 스킨 (2026-07-12) — 인디고→바이올렛 악센트 · 뉴트럴 배경 · 마이크로 인터랙션 ═══ */
  /* [v4-1] 팔레트: 다크 = 딥 인디고 나이트 */
  body.presenter-mode{background:#0D0F1E;}
  #presenterRoot{background:#0D0F1E;}
  .pTag{color:#8A93F8;}
  /* [v4-2] 컨트롤바 = 플로팅 독 카드 */
  .pControls{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 16px;}
  /* [v4-3] 버튼 마이크로 인터랙션: 호버 lift + 그림자 + 부드러운 전환 */
  .pTimer button,.pNav button,.pCtlBtn,.pToggleBtn,.pNoteSize button{background:#1A1E36;border:1px solid rgba(255,255,255,.1);border-radius:10px;transition:background .15s ease,transform .15s ease,box-shadow .15s ease;}
  .pTimer button:hover,.pNav button:hover,.pCtlBtn:hover,.pToggleBtn:hover,.pNoteSize button:hover{background:#232848;transform:translateY(-1px);box-shadow:0 4px 12px -4px rgba(0,0,0,.45);}
  .pNav button:disabled{transform:none;box-shadow:none;}
  /* [v4-4] 현재 썸네일 = 모던 링 + 살짝 확대 / [v4-5] 썸네일 호버 리프트 */
  .pThumb{border-radius:10px;border:2px solid rgba(255,255,255,.1);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .pThumb:hover{transform:translateY(-2px);border-color:rgba(168,85,247,.55);box-shadow:0 8px 18px -8px rgba(0,0,0,.5);}
  .pThumb.pThumbCurrent{border-width:2px;border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.35),0 10px 24px -10px rgba(99,102,241,.55);transform:scale(1.02);}
  /* [v4-6] 진행률 바: 그라데이션 + 글로우 */
  #pProgressFill{background:linear-gradient(90deg,#6366F1,#A855F7);box-shadow:0 0 10px rgba(139,92,246,.55);}
  /* [v4-7] 온보딩 = 그라데이션 카드 */
  #pOnboard{background:linear-gradient(135deg,#4F46E5,#8B5CF6);border:none;color:#fff;box-shadow:0 10px 28px -10px rgba(79,70,229,.55);}
  #pOnboard strong{color:#fff;}
  #pOnboard button{background:rgba(255,255,255,.18);}
  #pOnboard button:hover{background:rgba(255,255,255,.3);}
  /* [v4-8] 노트 카드: 좌측 악센트 바 + 라운드 업 */
  .pNotes{background:#151932;border-radius:14px;border-left:3px solid #6366F1;}
  .pNextNote{background:rgba(255,255,255,.05);}
  /* [v4-9] 타이머 상태색 현대화: 러닝 = 에메랄드 그라데이션 */
  .pTimerDisplay{color:#8A93F8;}
  .pTimerDisplay.running{color:#34D399;}
  #pTimerToggle.on{background:linear-gradient(135deg,#059669,#10B981);border:none;}
  .pCtlBtn.on{background:#4F46E5;border-color:rgba(255,255,255,.25);} /* [UX] 툴 버튼 활성 상태 */
  body.pLight .pCtlBtn.on{background:#4F46E5;color:#fff;border-color:#4F46E5;}
  .pConnChip.ok{color:#34D399;border-color:rgba(52,211,153,.35);}
  .pStage{border-radius:14px;}
  .pFilmstrip{border-radius:14px;}
  /* [v4-10] 커스텀 스크롤바: 얇고 라운드 */
  .pFilmstrip::-webkit-scrollbar,.pNotes::-webkit-scrollbar,#presenterRoot::-webkit-scrollbar{width:8px;height:8px;}
  .pFilmstrip::-webkit-scrollbar-thumb,.pNotes::-webkit-scrollbar-thumb,#presenterRoot::-webkit-scrollbar-thumb{background:rgba(138,147,248,.3);border-radius:99px;}
  .pFilmstrip::-webkit-scrollbar-thumb:hover,.pNotes::-webkit-scrollbar-thumb:hover{background:rgba(138,147,248,.55);}
  .pFilmstrip::-webkit-scrollbar-track,.pNotes::-webkit-scrollbar-track,#presenterRoot::-webkit-scrollbar-track{background:transparent;}
  /* ── v4 라이트 변형 ── */
  body.presenter-mode.pLight{background:#F4F5FA;}
  body.pLight #presenterRoot{background:#F4F5FA;color:#12172B;}
  body.pLight .pTag{color:#4F46E5;}
  body.pLight .pControls{background:#fff;border-color:#E4E7F2;box-shadow:0 2px 12px -6px rgba(18,23,43,.1);}
  body.pLight .pTimer button,body.pLight .pNav button,body.pLight .pCtlBtn,body.pLight .pToggleBtn,body.pLight .pNoteSize button{background:#fff;border-color:#E2E5F0;color:#1A2035;box-shadow:0 1px 2px rgba(18,23,43,.05);}
  body.pLight .pTimer button:hover,body.pLight .pNav button:hover,body.pLight .pCtlBtn:hover,body.pLight .pToggleBtn:hover,body.pLight .pNoteSize button:hover{background:#F6F7FE;box-shadow:0 4px 12px -4px rgba(79,70,229,.18);}
  body.pLight .pThumb{border-color:#E2E5F0;background:#fff;}
  body.pLight .pThumb:hover{border-color:rgba(147,51,234,.45);box-shadow:0 8px 18px -8px rgba(18,23,43,.2);}
  body.pLight .pThumb.pThumbCurrent{border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.22),0 10px 22px -10px rgba(79,70,229,.4);}
  body.pLight #pProgress{background:rgba(18,23,43,.06);}
  body.pLight #pProgressFill{background:linear-gradient(90deg,#4F46E5,#9333EA);box-shadow:none;}
  body.pLight #pOnboard{background:linear-gradient(135deg,#4F46E5,#8B5CF6);color:#fff;border:none;}
  body.pLight #pOnboard strong{color:#fff;}
  body.pLight .pNotes{background:#fff;border:1px solid #E4E7F2;border-left:3px solid #4F46E5;box-shadow:0 1px 3px rgba(18,23,43,.06);}
  body.pLight .pNextNote{background:#EEF0F9;color:#5B6478;}
  body.pLight .pTimerDisplay{color:#4F46E5;}
  body.pLight .pTimerDisplay.running{color:#059669;}

  body.pLight .pConnChip.ok{color:#059669;border-color:rgba(5,150,105,.35);}
  body.pLight .pCtrlSep{background:#E2E5F0;}
  body.pLight .pClock{color:#5B6478;border-right-color:#E2E5F0;}
  body.pLight .pCounter{color:#12172B;}
  body.pLight .pStage{border-color:#E2E5F0;box-shadow:0 14px 34px -18px rgba(18,23,43,.3);}
  body.pLight .pFilmstrip{background:#ECEEF6;}
  body.pLight .pFilmstrip::-webkit-scrollbar-thumb,body.pLight .pNotes::-webkit-scrollbar-thumb{background:rgba(79,70,229,.25);}
  body.pLight .pFilmstrip::-webkit-scrollbar-thumb:hover,body.pLight .pNotes::-webkit-scrollbar-thumb:hover{background:rgba(79,70,229,.45);}
  /* v4 마감: 도움말·팝업경고·토스트도 새 팔레트로 */
  .pHelpCard{background:#151932;border-color:rgba(138,147,248,.3);}

  /* ═══ v5 커뮤니티 피드백 반영 (2026-07-12) — 판서 · 쉬는시간 화면 · BGM · 돋보기 ═══ */
  /* [v5-1] 판서 캔버스: 청중 창은 deck-inner 안(1600×900, deck 스케일을 그대로 상속) / 발표자 창은 현재 슬라이드 박스 위 */
  #inkCanvas{position:absolute;top:0;left:0;width:1600px;height:900px;z-index:900;pointer-events:none;}
  body.inkOn #inkCanvas{pointer-events:auto;cursor:crosshair;}
  #pInkCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;}
  body.inkOn #pInkCanvas{pointer-events:auto;cursor:crosshair;}
  /* [v5-2] 판서 툴바 — 판서 모드일 때만 하단 중앙 플로팅 독 */
  #inkBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:none;align-items:center;gap:7px;background:rgba(13,15,30,.94);border:1px solid rgba(138,147,248,.45);border-radius:999px;padding:9px 16px;z-index:9990;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;box-shadow:0 14px 40px rgba(0,0,0,.45);}
  body.inkOn #inkBar{display:flex;}
  body.presenter-mode #inkBar{bottom:96px;} /* [UX] 발표자 창 컨트롤바와 겹침 방지 */
  .inkKbd{opacity:.5;font-size:10.5px;font-weight:800;margin-left:5px;font-family:ui-monospace,Menlo,monospace;}
  body.inkOn.inkErase #inkCanvas,body.inkOn.inkErase #pInkCanvas{cursor:cell;} /* [UX] 지우개 커서 구분 */
  .inkBtn{background:transparent;border:1px solid transparent;border-radius:999px;color:#DCE4FA;font-family:inherit;font-size:13.5px;font-weight:600;padding:7px 12px;cursor:pointer;white-space:nowrap;}
  .inkBtn:hover{background:rgba(255,255,255,.08);}
  .inkBtn.on{background:#4F46E5;color:#fff;border-color:rgba(255,255,255,.2);}
  .inkSep{width:1px;height:20px;background:rgba(255,255,255,.16);flex:0 0 auto;}
  .inkSwatch{width:21px;height:21px;border-radius:50%;border:2px solid rgba(255,255,255,.28);cursor:pointer;padding:0;flex:0 0 auto;transition:transform .12s ease,box-shadow .12s ease;}
  .inkSwatch:hover{transform:scale(1.12);}
  .inkSwatch.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3);transform:scale(1.12);}
  /* [v5-3] 쉬는 시간(B) 커스텀 화면 — BREAK_SCREEN 설정 시 검은 화면 대신 안내 화면 */
  .boWrap{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;padding:40px;}
  #blackoutOverlay.boCustom .boWrap{display:flex;}
  .boLogoText{font-size:16px;font-weight:800;letter-spacing:.3em;color:rgba(255,255,255,.55);}
  .boLogoImg{max-height:64px;max-width:340px;object-fit:contain;}
  .boTitle{font-size:58px;font-weight:800;line-height:1.3;word-break:keep-all;}
  .boSub{font-size:24px;font-weight:300;color:rgba(255,255,255,.65);line-height:1.6;word-break:keep-all;}
  .boClock{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:30px;font-weight:600;color:rgba(255,255,255,.8);margin-top:6px;}
  .boQrBox{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px;}
  .boQr{width:170px;height:170px;object-fit:contain;background:#fff;border-radius:14px;padding:10px;}
  .boQrLabel{font-size:16px;font-weight:600;color:rgba(255,255,255,.7);}
  #boBgmBtn{margin-top:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#fff;font-family:inherit;font-size:15px;font-weight:600;padding:10px 22px;cursor:pointer;}
  #boBgmBtn:hover{background:rgba(255,255,255,.2);}
  /* [v5-4] 마우스 돋보기 (M) — 청중 창 */
  #magLens{position:fixed;width:340px;height:340px;border-radius:50%;border:3px solid rgba(99,102,241,.9);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.5);overflow:hidden;z-index:9980;pointer-events:none;display:none;background:#fff;}
  #magLens .magInner{width:1600px;height:900px;position:absolute;top:0;left:0;transform-origin:0 0;}
  #magLens .magSlideClone{display:block;position:absolute;top:0;left:0;width:1600px;height:900px;overflow:hidden;font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  #magChip{position:fixed;z-index:9981;background:rgba(13,15,30,.9);color:#fff;border-radius:999px;padding:5px 12px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12.5px;font-weight:700;pointer-events:none;display:none;}
  /* [v5.2] ☕ 쉬는화면 설정 모달 — 코드 수정 없이 발표자 창에서 꾸미기 */
  #breakCfgOverlay{position:fixed;inset:0;z-index:9999;background:rgba(4,8,24,.72);display:none;align-items:center;justify-content:center;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;backdrop-filter:blur(3px);}
  #breakCfgOverlay.on{display:flex;}
  .bcCard{background:#151932;border:1px solid rgba(138,147,248,.3);border-radius:16px;padding:26px 30px;color:#fff;width:540px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .bcTitle{font-size:18px;font-weight:800;margin-bottom:6px;}
  .bcHint{font-size:12.5px;color:#8FA3C8;margin-bottom:16px;line-height:1.55;}
  .bcRow{margin-bottom:12px;}
  .bcRow>label{display:block;font-size:12.5px;font-weight:700;color:#8A93F8;margin-bottom:5px;}
  .bcRow input[type=text]{width:100%;background:#0F1A40;color:#fff;border:1px solid rgba(139,157,239,.4);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;box-sizing:border-box;}
  .bcInline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .bcCheck{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;}
  .bcCheck input{accent-color:#6366F1;width:16px;height:16px;}
  .bcThumb{height:40px;border-radius:6px;background:#fff;padding:3px;display:none;}
  .bcPresets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .bcPreset{background:#1A1E36;color:#DCE4FA;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
  .bcPreset:hover{background:#232848;border-color:rgba(138,147,248,.5);}
  .bcPreset.on{background:#4F46E5;color:#fff;border-color:transparent;}
  body.pLight .bcPreset.on{background:#4F46E5;color:#fff;}
  body.pLight .bcPreset{background:#F6F7FE;color:#1A2035;border-color:#E2E5F0;}
  body.pLight .bcPreset:hover{background:#EEF0F9;}
  .bcActions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .bcBtn{background:#4F46E5;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
  .bcBtn:hover{background:#6366F1;}
  .bcBtn.ghost{background:#1A1E36;color:#fff;border:1px solid rgba(255,255,255,.14);}
  .bcBtn.ghost:hover{background:#232848;}
  body.pLight .bcCard{background:#fff;color:#12172B;border-color:#E4E7F2;}
  body.pLight .bcRow input[type=text]{background:#fff;color:#0A1334;border-color:#C9D4EA;}
  body.pLight .bcHint{color:#5B6478;}
  body.pLight .bcBtn.ghost{background:#F6F7FE;color:#1A2035;border-color:#E2E5F0;}
  /* [v5.1] Z — 구역 확대: 드래그한 영역을 화면에 꽉 채움 */
  .zoomAnim{transition:transform .4s cubic-bezier(.22,.61,.36,1);}
  body.zoomSelMode #inkCanvas,body.zoomSelMode #pInkCanvas{pointer-events:auto;cursor:zoom-in;}
  @media print{
    #inkCanvas,#inkBar,#magLens,#magChip{display:none !important;}
  }


/* ══════════════════════════════════════════════════════════════
   학술 발표 테마 — 다집단 비교(multi-group)를 전제로 한 색 체계
   g1/g2는 색각이상 안전쌍(blue/amber). 표·수치는 tabular-nums.
   외부 폰트·CDN 없음 — 엔진의 오프라인 보장을 깨지 않음.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#0A1334;      /* 본문·제목 (발표자 창 네이비와 동일 계열) */
  --paper:#F4F6FB;    /* 밝은 슬라이드 배경 */
  --g1:#1F6FEB;       /* 집단 1 / 강조 */
  --g2:#D4700E;       /* 집단 2 / 대비 */
  --muted:#6B7590;    /* 보조 텍스트 */
  --rule:#DDE2EF;     /* 괘선 */
  --pad:96px;
}

/* ── 공통 ── */
.s{position:absolute;inset:0;padding:var(--pad);box-sizing:border-box;display:flex;flex-direction:column;}
.s-h{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--ink);margin:0;}
.s-eyebrow{font-size:14px;font-weight:700;letter-spacing:.22em;color:var(--g1);margin-bottom:18px;text-transform:uppercase;}
.s-rule{height:3px;background:var(--ink);width:64px;margin:24px 0 34px;flex:0 0 auto;}
.s-body{flex:1 1 auto;min-height:0;font-size:28px;line-height:1.6;color:var(--ink);}
.s-foot{font-size:16px;color:var(--muted);margin-top:auto;padding-top:20px;}

/* ── 표지 ── */
.s-title{justify-content:center;background:var(--ink);color:#fff;}
.s-title .s-h{color:#fff;font-size:68px;}
.s-title .s-sub{font-size:28px;font-weight:300;color:#9DAEDD;margin-top:22px;line-height:1.5;}
.s-title .s-meta{font-size:18px;color:#8B9DEF;margin-top:56px;line-height:1.8;}
.s-title .s-rule{background:var(--g2);}

/* ── 섹션 구분 ── */
.s-section{justify-content:center;background:var(--paper);}
.s-section .s-num{font-size:120px;font-weight:800;color:var(--rule);line-height:1;letter-spacing:-.04em;}
.s-section .s-h{font-size:60px;margin-top:-18px;}
.s-section .s-sub{font-size:24px;color:var(--muted);margin-top:18px;}

/* ── 불릿 ── */
.s-list{list-style:none;padding:0;margin:0;}
.s-list li{position:relative;padding-left:42px;margin-bottom:26px;}
.s-list li::before{content:'';position:absolute;left:0;top:16px;width:18px;height:3px;background:var(--g1);}
.s-list li b{font-weight:700;}
.s-list li em{font-style:normal;background:linear-gradient(transparent 62%, #FCE3C4 62%);font-weight:600;}

/* ── 2단 ── */
.s-two{display:grid;grid-template-columns:1fr 1fr;gap:56px;flex:1 1 auto;min-height:0;}
.s-col{font-size:26px;line-height:1.6;}
.s-col .s-colh{font-size:20px;font-weight:800;letter-spacing:.04em;padding-bottom:12px;margin-bottom:22px;border-bottom:2px solid var(--rule);}
.s-two .s-col:first-child .s-colh{color:var(--g1);border-bottom-color:var(--g1);}
.s-two .s-col:last-child .s-colh{color:var(--g2);border-bottom-color:var(--g2);}

/* ── 표 (이 덱의 시그니처) ──
   괘선은 의미가 있는 곳에만. 수치는 자릿수 정렬. */
.s-table{width:100%;border-collapse:collapse;font-size:24px;font-variant-numeric:tabular-nums;}
.s-table caption{text-align:left;font-size:16px;color:var(--muted);padding-bottom:12px;caption-side:top;}
.s-table th{font-size:17px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:right;padding:0 18px 12px;border-bottom:2px solid var(--ink);white-space:nowrap;}
.s-table th:first-child{text-align:left;}
.s-table td{padding:16px 18px;text-align:right;border-bottom:1px solid var(--rule);color:var(--ink);}
.s-table td:first-child{text-align:left;font-weight:600;}
.s-table tr:last-child td{border-bottom:2px solid var(--ink);}
.s-table .hi{color:var(--g1);font-weight:700;}
.s-table .hi2{color:var(--g2);font-weight:700;}
.s-table .sig{font-size:16px;color:var(--muted);vertical-align:super;margin-left:2px;}

/* ── 이미지 ── */
.s-img{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;}
.s-img img{max-width:100%;max-height:100%;object-fit:contain;}
.s-cap{font-size:16px;color:var(--muted);margin-top:18px;}

/* ── 인용 ── */
.s-quote{justify-content:center;background:var(--paper);}
.s-quote .s-q{font-size:40px;line-height:1.5;font-weight:300;color:var(--ink);border-left:5px solid var(--g2);padding-left:40px;}
.s-quote .s-cite{font-size:20px;color:var(--muted);margin-top:32px;padding-left:45px;}

/* ══════════════════════════════════════════════════════════════
   편집 모드 UI — 도구는 조용하게, 무대만 밝게
   ══════════════════════════════════════════════════════════════ */
#edRoot{position:fixed;inset:0;z-index:200;background:#0D1226;color:#E7EAF5;
  font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:none;grid-template-columns:216px 1fr 320px;grid-template-rows:56px 1fr;}
body.editing #edRoot{display:grid;}
body.editing .nav,body.editing #presenterBtn{display:none !important;}
#edRoot *{box-sizing:border-box;}

.ed-bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 16px;background:#0A1334;border-bottom:1px solid #232C52;}
.ed-bar .ed-name{font-weight:700;font-size:14px;letter-spacing:.02em;}
.ed-bar .ed-spacer{flex:1;}
.ed-btn{background:#1B2450;color:#E7EAF5;border:1px solid #2E3A6B;border-radius:7px;padding:7px 13px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.ed-btn:hover:not(:disabled){background:#26315F;}
.ed-btn:disabled{opacity:.3;cursor:default;}
.ed-btn.pri{background:var(--g1);border-color:var(--g1);color:#fff;}
.ed-btn.pri:hover{background:#1A5FD0;}
.ed-btn.ed-ico{padding:7px 10px;font-size:15px;line-height:1;}
.ed-btn:focus-visible,.ed-chip:focus-visible{outline:2px solid #8B9DEF;outline-offset:2px;}
.ed-dirty{font-size:12px;color:#F2B45E;font-weight:600;display:none;}
body.dirty .ed-dirty{display:inline;}

/* ── 슬라이드 목록 — [+ 슬라이드]는 아래에 고정해서 길어져도 안 밀려남 ── */
.ed-side{background:#0A1334;border-right:1px solid #232C52;display:grid;grid-template-rows:1fr auto;min-height:0;}
#edList{overflow-y:auto;padding:10px;}
.ed-addwrap{position:relative;display:flex;gap:5px;padding:10px;border-top:1px solid #232C52;background:#0A1334;}
.ed-add{flex:1;}
.ed-caret{padding:7px 9px;}
.ed-menu{display:none;position:absolute;bottom:calc(100% + 6px);left:10px;right:10px;background:#141C3E;
  border:1px solid #2E3A6B;border-radius:9px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:5;}
.ed-menu.on{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.ed-menu button{background:none;border:0;color:#B9C2E0;text-align:left;padding:7px 9px;border-radius:6px;
  font-size:12.5px;cursor:pointer;font-family:inherit;}
.ed-menu button:hover{background:var(--g1);color:#fff;}

.ed-card{display:flex;align-items:center;gap:7px;padding:6px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;margin-bottom:5px;}
.ed-card:hover{background:#141C3E;}
.ed-card.on{background:#182352;border-color:var(--g1);}
.ed-card.drag{opacity:.4;}
.ed-card.over{border-color:var(--g2);}
.ed-card .n{font-size:10px;color:#7C87AD;width:16px;flex:0 0 auto;font-variant-numeric:tabular-nums;}
/* 썸네일 = 슬라이드를 실제로 렌더해 축소한 것 (캡처 아님 → 항상 원본과 일치) */
.ed-card .tw{flex:1;position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;border-radius:3px;
  pointer-events:none;}
.ed-card .ti{position:absolute;top:0;left:0;width:1600px;height:900px;transform-origin:top left;}

.ed-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:24px;
  background:#070B18;overflow:auto;}
.ed-stage.over{outline:2px dashed var(--g1);outline-offset:-10px;}
.ed-drop{display:none;position:absolute;inset:24px;align-items:center;justify-content:center;
  background:rgba(7,11,24,.86);color:#9DB8F0;font-size:15px;font-weight:600;border-radius:10px;
  pointer-events:none;z-index:2;}
.ed-stage.over .ed-drop{display:flex;}
.ed-frame{width:1600px;height:900px;position:relative;background:#fff;transform-origin:center center;
  flex:0 0 auto;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.ed-frame [contenteditable]{outline:none;border-radius:3px;}
.ed-frame [contenteditable]:hover{box-shadow:0 0 0 2px rgba(31,111,235,.25);}
.ed-frame [contenteditable]:focus{box-shadow:0 0 0 2px var(--g1);}
.ed-frame [data-cell]{min-width:60px;}

.ed-insp{background:#0A1334;border-left:1px solid #232C52;overflow-y:auto;padding:16px;}
.ed-lbl{font-size:11px;font-weight:700;letter-spacing:.14em;color:#7C87AD;margin:18px 0 8px;}
.ed-lbl:first-child{margin-top:0;}
.ed-chips{display:flex;flex-wrap:wrap;gap:6px;}
.ed-chip{background:#141C3E;border:1px solid #2E3A6B;color:#B9C2E0;border-radius:999px;padding:5px 11px;
  font-size:12px;cursor:pointer;font-family:inherit;}
.ed-chip.on{background:var(--g1);border-color:var(--g1);color:#fff;font-weight:600;}
.ed-ta{width:100%;background:#070B18;border:1px solid #2E3A6B;border-radius:8px;color:#E7EAF5;padding:11px;
  font-size:13px;line-height:1.65;font-family:inherit;resize:vertical;}
.ed-ta:focus{outline:none;border-color:var(--g1);}
.ed-hint{font-size:11.5px;color:#7C87AD;line-height:1.6;margin-top:8px;}
.ed-ops{display:flex;gap:6px;margin-top:10px;}
.ed-ops .ed-btn{flex:1;padding:7px 0;font-size:12px;}
.ed-del{color:#F08A8A;border-color:#4A2A3A;}

/* ── 캔버스(자유 배치) ── */
.s-canvas{position:absolute;inset:0;overflow:hidden;background:#fff;}
.s-canvas .ci{box-sizing:border-box;}
.s-canvas .ci-text{outline:none;}
/* 편집 중에만: 선택 표시·리사이즈 핸들·호버 (발표 화면엔 안 나옴) */
body.editing .ed-frame .ci{cursor:move;}
body.editing .ed-frame .ci:hover{box-shadow:0 0 0 1.5px rgba(31,111,235,.4);}
body.editing .ed-frame .ci.sel{box-shadow:0 0 0 2px var(--g1);}
body.editing .ed-frame .ci-text[contenteditable="true"]{cursor:text;box-shadow:0 0 0 2px var(--g1);}
.ci-handle{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;
  background:var(--g1);border:2px solid #fff;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.4);}

/* 장 배경색(s.bg) — 레이아웃 자체 배경(표지 네이비 등)을 투명화해 지정 색이 보이게 */
.slidebg > .s{background:transparent !important;}

/* ── 로고 오버레이 (발표·편집·썸네일 공통) ── */
.deck-logo{position:absolute;height:var(--logo-h,72px);width:auto;object-fit:contain;z-index:6;pointer-events:none;}
.deck-logo.tl{top:44px;left:56px;} .deck-logo.tr{top:44px;right:56px;}
.deck-logo.bl{bottom:44px;left:56px;} .deck-logo.br{bottom:44px;right:56px;}

/* ── 로고 인스펙터 ── */
.ed-brand .ed-add{width:100%;}
.ed-logo-row{display:flex;gap:12px;align-items:center;}
.ed-logo-prev{width:76px;height:50px;object-fit:contain;background:#070B18;border:1px solid #2E3A6B;border-radius:6px;padding:5px;flex:0 0 auto;}
.ed-logo-ctl{display:flex;flex-direction:column;gap:8px;}
.ed-logo-pos{display:grid;grid-template-columns:repeat(2,28px);grid-auto-rows:24px;gap:3px;}
.ed-logo-pos button,.ed-logo-size button{background:#141C3E;border:1px solid #2E3A6B;color:#B9C2E0;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;}
.ed-logo-pos button.on{background:var(--g1);border-color:var(--g1);color:#fff;}
.ed-logo-size{display:flex;align-items:center;gap:8px;}
.ed-logo-size span{font-size:12px;color:#B9C2E0;min-width:40px;text-align:center;}
.ed-logo-size button{width:28px;height:24px;}

/* ── 글자 서식 미니 툴바 ── */
#edFmt{position:fixed;z-index:300;display:none;gap:4px;align-items:center;background:#141C3E;
  border:1px solid #2E3A6B;border-radius:10px;padding:5px 7px;box-shadow:0 8px 28px rgba(0,0,0,.5);}
#edFmt.on{display:flex;}
#edFmt button{width:28px;height:28px;border:1px solid transparent;border-radius:6px;background:transparent;
  color:#E7EAF5;cursor:pointer;font-size:14px;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0;}
#edFmt button:hover{background:#1A2450;}
#edFmt .sw{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.3);}
#edFmt .sep{width:1px;height:20px;background:#2E3A6B;margin:0 2px;flex:0 0 auto;}
/* 색 직접 고르기 (툴바·캔버스 공용) */
.cpick,.ci-cpick{position:relative;width:22px;height:22px;border-radius:50%;overflow:hidden;cursor:pointer;
  border:2px dashed #8B9DEF;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.cpick input,.ci-cpick input{position:absolute;inset:-4px;width:200%;height:200%;border:none;padding:0;cursor:pointer;opacity:0;}
.cpick span,.ci-cpick span{font-size:13px;color:#B9C2E0;pointer-events:none;}
.ci-cpick{width:26px;height:26px;}

#edHome{text-decoration:none;position:fixed;right:20px;bottom:96px;z-index:60;background:rgba(10,19,52,.72);color:#fff;
  border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:600;
  letter-spacing:.03em;cursor:pointer;opacity:.85;
  font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
#edHome:hover{opacity:1;}
#edEnter{position:fixed;right:20px;bottom:56px;z-index:60;background:rgba(10,19,52,.72);color:#fff;
  border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:600;
  letter-spacing:.03em;cursor:pointer;opacity:.85;
  font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
#edEnter:hover{opacity:1;}
body.presenter-mode #edEnter,body.editing #edEnter,body.uiIdle #edEnter,
body.presenter-mode #edHome,body.editing #edHome,body.uiIdle #edHome{display:none;}
@media print{#edRoot,#edEnter,#edHome{display:none !important;}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

/* ══ 장 모션(s.anim) — 페이드·떠오르기·확대·밀어넣기·순차 등장 ══
   .slide.active 하위로만 스코프: 엔진이 장을 넘겨 active 를 다시 붙일 때마다 재생.
   편집 캔버스·썸네일은 .slide 밖이라 정지 화면(편집은 차분하게, 발표만 움직이게).
   외부 리소스 0 — CSS 키프레임만. 접근성 감속은 위 prefers-reduced-motion 전역이 처리. */
@keyframes dkFade{from{opacity:0}to{opacity:1}}
@keyframes dkRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes dkZoom{from{opacity:0;transform:scale(.955)}to{opacity:1;transform:none}}
@keyframes dkWipe{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}

.slide.active .anim-fade{animation:dkFade .6s ease-out both;}
.slide.active .anim-zoom{animation:dkZoom .55s cubic-bezier(.22,.61,.36,1) both;}

/* 떠오르기·밀어넣기 — 장 안 요소가 위에서부터 차례로 */
.slide.active .anim-rise .s>*{animation:dkRise .55s cubic-bezier(.22,.61,.36,1) both;}
.slide.active .anim-wipe .s>*{animation:dkWipe .5s cubic-bezier(.22,.61,.36,1) both;}
.slide.active .anim-rise .s>*:nth-child(2),.slide.active .anim-wipe .s>*:nth-child(2){animation-delay:.09s;}
.slide.active .anim-rise .s>*:nth-child(3),.slide.active .anim-wipe .s>*:nth-child(3){animation-delay:.18s;}
.slide.active .anim-rise .s>*:nth-child(4),.slide.active .anim-wipe .s>*:nth-child(4){animation-delay:.27s;}
.slide.active .anim-rise .s>*:nth-child(5),.slide.active .anim-wipe .s>*:nth-child(5){animation-delay:.36s;}
.slide.active .anim-rise .s>*:nth-child(6),.slide.active .anim-wipe .s>*:nth-child(6){animation-delay:.45s;}
.slide.active .anim-rise .s>*:nth-child(n+7),.slide.active .anim-wipe .s>*:nth-child(n+7){animation-delay:.54s;}

/* 순차 등장 — 뼈대는 먼저 뜨고, 항목·표 행·2단 컬럼이 하나씩 */
.slide.active .anim-seq .s>*{animation:dkFade .4s ease-out both;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col){animation:dkRise .5s cubic-bezier(.22,.61,.36,1) both;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(1){animation-delay:.25s;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(2){animation-delay:.6s;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(3){animation-delay:.95s;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(4){animation-delay:1.3s;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(5){animation-delay:1.65s;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(6){animation-delay:2s;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(7){animation-delay:2.35s;}
.slide.active .anim-seq :is(.s-list>li,.s-table tbody tr,.s-two .s-col):nth-child(n+8){animation-delay:2.7s;}

/* ── 편집 캔버스: 필드 드래그 이동 어포던스 ── */
#edFrame [data-f]:hover{outline:1px dashed rgba(139,157,239,.55);outline-offset:3px;cursor:grab;}
#edFrame [data-f]:focus,#edFrame [data-f]:focus-within{outline:2px solid rgba(139,157,239,.7);cursor:text;}
#edFrame .f-drag{outline:2px dashed #8B9DEF !important;cursor:grabbing !important;user-select:none;}

/* ══ 발표자 창 기본 레이아웃 보정 (엔진 무접촉 — 테마가 엔진 CSS 뒤에 삽입되어 같은 선택자를 덮어씀) ══
   엔진 기본은 .pTop{flex:0 1 220px} — 현재 슬라이드 영역이 창 크기와 무관하게 220px라
   큰 모니터에서도 슬라이드가 작고 판서가 불편합니다. 기본을 "남는 높이를 현재 슬라이드가
   모두 차지"로 바꿉니다. 사용자가 스플리터를 끌면 엔진이 인라인 style.flex 를 덮어쓰므로
   (localStorage 기억) 수동 조정은 그대로 존중됩니다. 모니터가 바뀌어도 CSS 기본은 비율로 따라갑니다. */
#presenterRoot{--thumbW:clamp(150px, 11vw, 240px);}
