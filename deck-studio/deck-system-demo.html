addEventListener('keydown',e=>{
  const tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return; /* 입력 중엔 단축키 무시 */
  /* ⌘K: 발표자 모드 열기 — 브라우저 예약 단축키가 아니라 가로채기 가능(⌘L은 주소창 예약이라 미사용) */
  if((e.metaKey||e.ctrlKey)&&e.code==='KeyK'){ /* [v3-26] 맥 ⌘K + 윈도우 Ctrl+K */
    if(!isPresenter){e.preventDefault();openPresenter();}
    return;
  }
  /* [개선 27] ⌘/Ctrl/Alt 조합키는 브라우저 기본 동작에 전부 양보 (⌘← 뒤로가기 등과 충돌 제거) */
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  /* [개선 3] 숫자 + Enter 점프 */
  const dm=e.code.match(/^(?:Digit|Numpad)(\d)$/);
  if(dm){jumpDigit(dm[1]);return;}
  if(e.key==='Enter'){
    if(jumpBuf){e.preventDefault();jumpCommit();return;}
    if(tag==='BUTTON')return; /* 버튼 포커스 시 Enter는 버튼에 양보 */
    show(i+1);return;
  }
  if(e.key==='Escape'){
    if(inkTool){inkSetTool(null);return;} /* [v5] 판서 먼저 종료 */
    if(zoomSelMode||zoomRegion){zoomToggle();return;} /* [v5.1] 구역 확대 종료 */
    const bco=document.getElementById('breakCfgOverlay');if(bco&&bco.classList.contains('on')){bco.classList.remove('on');return;} /* [v5.2] */
    jumpBuf='';updateJumpToast();
    toggleHelp(false);
    return;
  }
  if(e.key==='?'){toggleHelp();return;}
  /* e.code(물리 키 위치) 기준 — 한/영 입력 모드와 무관하게 항상 반응 */
  switch(e.code){
    /* [개선 1] 리모컨(클리커) 호환: PgUp/PgDn·Space·Backspace */
    case 'ArrowRight':case 'PageDown':e.preventDefault();show(i+1);break;
    case 'ArrowLeft':case 'PageUp':e.preventDefault();show(i-1);break;
    case 'Space':if(tag==='BUTTON')return;e.preventDefault();show(e.shiftKey?i-1:i+1);break;
    case 'Backspace':e.preventDefault();show(i-1);break;
    /* [개선 2] Home/End 점프 */
    case 'Home':e.preventDefault();show(0);break;
    case 'End':e.preventDefault();show(TOTAL-1);break;
    case 'KeyP':if(!isPresenter)openPresenter();break;
    case 'KeyV':if(isPresenter)toggleViewMode();break;
    case 'KeyB':setBlackout('black');break;
    case 'KeyW':setBlackout('white');break;
    case 'KeyF':toggleFullscreen();break;
    case 'F5':e.preventDefault();toggleFullscreen();break; /* [v3-22] 파워포인트 습관·클리커 F5 호환 */
    case 'KeyT':if(isPresenter)toggleTimer();break;
    case 'KeyR':if(isPresenter)resetTimerPress();break;
    case 'KeyH':toggleHelp();break;
    /* [v5] 판서 · 돋보기 */
    case 'KeyD':inkSetTool('pen');break;
    case 'KeyG':inkSetTool('hl');break;
    case 'KeyE':inkSetTool('erase');break;
    case 'KeyM':magToggle();break;
    case 'KeyZ':zoomToggle();break;
  }
});

/* [개선 29] 타이머 작동 중 발표자 창을 닫으려 하면 한 번 확인 (실수 ⌘W 방지) */
addEventListener('beforeunload',e=>{
  if(isPresenter&&timerRunning){e.preventDefault();e.returnValue='';}
});

if(isPresenter){
  try{const saved=localStorage.getItem(LS_KEY);if(saved!==null)i=Math.max(0,Math.min(parseInt(saved,10)||0,TOTAL-1));}catch(e){}
  applyBlackoutFromStore();
  initPresenter();
  render();
  addEventListener('resize',renderPresenter);
  addEventListener('resize',reclampNextWidthOnResize);
}else{
  /* 청중 창 새로 열릴 땐 지난 세션의 블랙아웃 상태를 항상 해제 (열자마자 검은 화면 방지) */
  blackoutMode=null;
  try{localStorage.setItem(BLACK_KEY,'');}catch(e){}
  applyBlackout();
  /* [v5] 청중 창 판서 캔버스 — deck 안에 넣어 화면 배율을 그대로 상속 */
  const inkCv=document.createElement('canvas');
  inkCv.id='inkCanvas';inkCv.width=3200;inkCv.height=1800;
  inner.appendChild(inkCv);
  inkAttach(inkCv);
  addEventListener('resize',fit);fit();show(0);render();
  const nhb=document.getElementById('navHelpBtn'); /* [v3-2] 하단 힌트에서 클릭으로 도움말 */
  if(nhb)nhb.addEventListener('click',()=>toggleHelp());
  /* [개선 24·25] 4초 아무 조작 없으면 하단 힌트·버튼 페이드 + 커서 숨김 (프로젝터 화면 청결) */
  let _idleT=null;
  function uiWake(){
    document.body.classList.remove('uiIdle');
    clearTimeout(_idleT);
    _idleT=setTimeout(()=>document.body.classList.add('uiIdle'),4000);
  }
  ['mousemove','mousedown','keydown','touchstart'].forEach(ev=>addEventListener(ev,uiWake,{passive:true}));
  uiWake();
}

</script>
<script id="deckEditor">
/* ══════════════════════════════════════════════════════════════
   편집 모드 — PPT 기본 보기 + Canva식 직접 조작

   구조 변경(추가·삭제·순서)은 엔진이 로드 시점에 슬라이드를 한 번만
   읽기 때문에, [발표하기]를 누를 때 새로고침으로 반영합니다.

   모든 상태 변경은 edit()/editText()를 통과합니다 — 되돌리기 스택이
   여기서만 쌓이므로, 새 기능을 붙일 때도 이 두 개만 쓰면 됩니다.
   ══════════════════════════════════════════════════════════════ */
(function(){
  let cur = 0, EDIT = false;
  let selCI = null, frameScale = 1;   /* 캔버스: 선택된 요소 index, 프레임 축소배율 */
  const UNDO = [], REDO = [], LIMIT = 80;

  /* ── UI 뼈대 ── */
  const enterBtn = document.createElement('button');
  enterBtn.id = 'edEnter'; enterBtn.type = 'button'; enterBtn.textContent = '✎ 편집';
  document.body.appendChild(enterBtn);
  /* 스튜디오로 돌아가기 — dist/ 안의 index.html. 발표자 팝업(#presenter)에서는 숨김 */
  const homeBtn = document.createElement('a');
  homeBtn.id = 'edHome'; homeBtn.href = './index.html'; homeBtn.textContent = '⌂ 덱 목록';
  homeBtn.title = '스튜디오(덱 목록)로 돌아가기';
  document.body.appendChild(homeBtn);

  const root = document.createElement('div');
  root.id = 'edRoot';
  root.innerHTML = `
    <div class="ed-bar">
      <span class="ed-name"></span>
      <span class="ed-dirty">● 저장 안 됨</span>
      <span class="ed-spacer"></span>
      <button class="ed-btn ed-ico" id="edUndo" type="button" title="되돌리기 ⌘Z">↶</button>
      <button class="ed-btn ed-ico" id="edRedo" type="button" title="다시 실행 ⇧⌘Z">↷</button>
      <button class="ed-btn" id="edReset" type="button">원본으로</button>
      <button class="ed-btn" id="edSaveData" type="button">데이터로 저장</button>
      <button class="ed-btn" id="edSave" type="button">HTML로 저장</button>
      <button class="ed-btn pri" id="edExit" type="button">발표하기</button>
    </div>
    <div class="ed-side">
      <div id="edList"></div>
      <div class="ed-addwrap">
        <button class="ed-btn ed-add" id="edAdd" type="button">+ 슬라이드</button>
        <button class="ed-btn ed-caret" id="edAddMenu" type="button" title="레이아웃 고르기">▾</button>
        <div class="ed-menu" id="edMenu"></div>
      </div>
    </div>
    <div class="ed-stage" id="edStage"><div class="ed-frame" id="edFrame"></div>
      <div class="ed-drop" id="edDrop">그림을 놓으면 이 장에 들어갑니다</div></div>
    <div class="ed-insp" id="edInsp"></div>`;
  document.body.appendChild(root);

  const $ = id => document.getElementById(id);
  const frame = $('edFrame'), list = $('edList'), insp = $('edInsp'), stage = $('edStage');
  root.querySelector('.ed-name').textContent = DECK.title;

  /* ══ 변경 관문 ══════════════════════════════════════════════
     상태를 바꾸는 모든 경로가 여기를 지납니다.
     edit()     — 구조 변경. 한 번에 하나씩 되돌려짐
     editText() — 타이핑. 800ms 쉴 때까지 한 덩어리로 묶임 (글자마다
                  되돌리기가 쌓이면 ⌘Z가 쓸모없어지므로)
     ═════════════════════════════════════════════════════════ */
  const snap = () => JSON.stringify(DECK_SLIDES);
  let typing = null;

  function push(){
    UNDO.push(snap());
    if(UNDO.length > LIMIT) UNDO.shift();
    REDO.length = 0;
  }
  function edit(fn){ clearTimeout(typing); typing = null; push(); fn(); touch(); marks(); }
  function editText(fn){
    if(!typing) push();
    clearTimeout(typing);
    typing = setTimeout(() => { typing = null; }, 800);
    fn(); touch(); marks();
  }
  function restore(from, to){
    if(!from.length) return;
    clearTimeout(typing); typing = null;
    to.push(snap());
    DECK_SLIDES = JSON.parse(from.pop());
    cur = Math.min(cur, DECK_SLIDES.length - 1);
    touch(); drawAll();
  }
  const undo = () => restore(UNDO, REDO);
  const redo = () => restore(REDO, UNDO);
  function marks(){
    $('edUndo').disabled = !UNDO.length;
    $('edRedo').disabled = !REDO.length;
  }

  /* ── 초안 저장 ──
     매 키 입력마다 전체 덱을 직렬화하면 장수가 많을 때 부담이라 모아서 씁니다. */
  let saveT = null;
  function touch(){
    document.body.classList.add('dirty');
    clearTimeout(saveT);
    saveT = setTimeout(save, 400);
  }
  function save(){
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({ built: DECK.built, slides: DECK_SLIDES, fonts: DECK.fonts })); }
    catch(e){ console.warn('초안 저장 실패 — 용량 초과일 수 있어요', e); }
  }
  function flush(){ clearTimeout(saveT); save(); }
  if(HAS_DRAFT) document.body.classList.add('dirty');

  /* ── 축소 배율 ── */
  function fitFrame(){
    const s = Math.max(0.05, Math.min((stage.clientWidth - 48) / 1600, (stage.clientHeight - 48) / 900));
    frameScale = s;
    frame.style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', () => { fitFrame(); });

  /* ── 슬라이드 목록 (썸네일) ──
     캡처가 아니라 슬라이드를 그대로 렌더해 축소합니다 — 엔진 필름스트립과 같은 방식이라
     항상 원본과 일치하고 이미지 도구가 필요 없습니다. */
  function drawList(){
    list.innerHTML = '';
    DECK_SLIDES.forEach((s, i) => {
      const c = document.createElement('div');
      c.className = 'ed-card' + (i === cur ? ' on' : '');
      c.draggable = true;
      c.dataset.i = i;
      c.innerHTML = `<span class="n">${String(i+1).padStart(2,'0')}</span>
        <div class="tw"><div class="ti">${slideHTML(s)}</div></div>`;
      c.onclick = () => { cur = i; drawAll(); };
      list.appendChild(c);
    });
    scaleThumbs();
  }
  function scaleThumbs(){
    list.querySelectorAll('.tw').forEach(tw => {
      const el = tw.querySelector('.ti');
      if(el) el.style.transform = 'scale(' + (tw.clientWidth / 1600) + ')';
    });
  }
  function syncCard(){
    const c = list.children[cur];
    if(!c) return;
    const el = c.querySelector('.ti');
    if(el){ el.innerHTML = slideHTML(DECK_SLIDES[cur]); scaleThumbs(); }
  }

  /* ── 드래그로 순서 바꾸기 ── */
  let dragI = null;
  list.addEventListener('dragstart', e => {
    const c = e.target.closest('.ed-card'); if(!c) return;
    dragI = +c.dataset.i; c.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
  });
  list.addEventListener('dragend', () => {
    dragI = null;
    list.querySelectorAll('.ed-card').forEach(c => c.classList.remove('drag', 'over'));
  });
  list.addEventListener('dragover', e => {
    if(dragI === null) return;
    e.preventDefault();
    const c = e.target.closest('.ed-card'); if(!c) return;
    list.querySelectorAll('.ed-card').forEach(x => x.classList.toggle('over', x === c));
  });
  list.addEventListener('drop', e => {
    if(dragI === null) return;
    e.preventDefault();
    const c = e.target.closest('.ed-card'); if(!c) return;
    const to = +c.dataset.i, from = dragI;
    if(to === from) return;
    edit(() => {
      const [m] = DECK_SLIDES.splice(from, 1);
      DECK_SLIDES.splice(to, 0, m);
      cur = to;
    });
    drawAll();
  });

  /* ══ 캔버스 직접 편집 ══════════════════════════════════════
     kind 별로 모델에 되쓰는 방법이 다릅니다.
       list  — <ul contenteditable>은 Enter가 native로 <li>를 만듭니다 (PPT와 동일)
       table — 셀 단위 편집. 마지막 칸에서 Tab이면 행이 늘어납니다 (엑셀과 동일)
       그 외 — 요소 innerHTML 그대로
     ═════════════════════════════════════════════════════════ */
  const clean = h => h.replace(/<br\s*\/?>\s*$/i, '').trim();

  function readList(ul){
    return [...ul.querySelectorAll('li')].map(li => clean(li.innerHTML)).filter(t => t !== '').join('\n');
  }
  function readTable(tb){
    const row = tr => [...tr.children].map(c => clean(c.innerHTML) || ' ').join(' | ');
    const head = tb.tHead ? [row(tb.tHead.rows[0])] : [];
    const body = [...(tb.tBodies[0]?.rows || [])].map(row);
    return head.concat(body).join('\n');
  }

  /* ── 필드 드래그 이동 ──
     좌클릭한 채 6px 이상 끌면 이동(s.off[f]에 커밋), 그냥 클릭이면 기존 텍스트 편집.
     편집 중(포커스가 요소 안)에는 드래그 = 텍스트 선택 그대로. transform이라
     주변 레이아웃은 안 밀린다. 커밋은 pointerup에서 edit() 한 번 — ⌘Z 한 방에 복귀. */
  function bindFieldDrag(el, f, s){
    el.addEventListener('pointerdown', e => {
      if(e.button !== 0) return;
      if(el.contains(document.activeElement)) return;          /* 편집 중 → 텍스트 선택 */
      const off = (s.off && s.off[f]) || [0, 0];
      const ox = +off[0] || 0, oy = +off[1] || 0;
      const sx = e.clientX, sy = e.clientY;
      let nx = ox, ny = oy, moved = false;
      const move = ev => {
        nx = ox + (ev.clientX - sx) / frameScale;
        ny = oy + (ev.clientY - sy) / frameScale;
        if(!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 6){
          moved = true;
          el.classList.add('f-drag');
          getSelection().removeAllRanges();
        }
        if(moved){
          ev.preventDefault();
          el.style.transform = 'translate(' + Math.round(nx) + 'px,' + Math.round(ny) + 'px)';
        }
      };
      const up = () => {
        removeEventListener('pointermove', move); removeEventListener('pointerup', up);
        el.classList.remove('f-drag');
        if(!moved) return;                                      /* 그냥 클릭 → 편집 흐름 유지 */
        /* 드래그 직후 따라오는 click이 contenteditable 포커스를 잡지 않게 1회 차단 */
        el.addEventListener('click', ce => { ce.preventDefault(); ce.stopPropagation(); }, { capture: true, once: true });
        edit(() => {
          if(!s.off) s.off = {};
          const rx = Math.round(nx), ry = Math.round(ny);
          if(rx || ry) s.off[f] = [rx, ry]; else delete s.off[f];
          if(!Object.keys(s.off).length) delete s.off;
        });
        drawAll();
      };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
  }

  function bindCanvas(){
    const s = DECK_SLIDES[cur];
    frame.querySelectorAll('[data-f]').forEach(el => {
      const kind = el.dataset.kind, f = el.dataset.f;
      bindFieldDrag(el, f, s);   /* 좌클릭 드래그 = 위치 이동 (모든 레이아웃 공통) */

      if(kind === 'table'){
        el.querySelectorAll('[data-cell]').forEach(td => {
          td.setAttribute('contenteditable', 'true');
          td.addEventListener('input', () => {
            editText(() => { s[f] = readTable(el); });
            mirror(f, s[f]); syncCard();
          });
        });
        return;   /* Tab 처리는 아래 캡처 핸들러에 있음 — 여기 두면 안 불립니다 */
      }

      el.setAttribute('contenteditable', 'true');
      el.addEventListener('input', () => {
        editText(() => { s[f] = kind === 'list' ? readList(el) : el.innerHTML; });
        mirror(f, s[f]); syncCard();
      });
    });
    if(s.layout === 'canvas') bindCanvasItems();
  }
  function mirror(f, v){
    const m = insp.querySelector('[data-if="' + f + '"]');
    if(m && m.value !== v) m.value = v;
  }

  /* ══ 캔버스(자유 배치) ══════════════════════════════════════
     요소를 절대좌표로 끌어 배치. 화면 델타를 frameScale로 나눠 1600×900
     좌표로 환산합니다. 드래그 중엔 DOM만 움직이고, pointerup에서 edit()로
     한 번에 커밋 — 되돌리기가 이동 전 상태를 잡도록. ═════════════════ */
  function itemsOf(){ const s = DECK_SLIDES[cur]; if(!Array.isArray(s.items)) s.items = []; return s.items; }

  function addHandle(el, idx){
    const h = document.createElement('div');
    h.className = 'ci-handle';
    el.appendChild(h);
    h.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const it = itemsOf()[idx];
      const ow = it.w || el.offsetWidth, oh = it.h || el.offsetHeight, sx = e.clientX, sy = e.clientY;
      const box = it.type === 'rect' || it.type === 'ellipse' || it.type === 'html';
      let nw = ow, nh = oh;
      const move = ev => {
        nw = Math.max(30, ow + (ev.clientX - sx) / frameScale);
        nh = Math.max(20, oh + (ev.clientY - sy) / frameScale);
        el.style.width = Math.round(nw) + 'px';
        if(box) el.style.height = Math.round(nh) + 'px';
      };
      const up = () => {
        removeEventListener('pointermove', move); removeEventListener('pointerup', up);
        edit(() => { it.w = Math.round(nw); if(box) it.h = Math.round(nh); });
        syncCard();
      };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
  }

  function selectItem(idx){
    selCI = idx;
    frame.querySelectorAll('.ci').forEach(el => {
      const on = +el.dataset.ci === idx;
      el.classList.toggle('sel', on);
      const old = el.querySelector('.ci-handle'); if(old) old.remove();
      if(on) addHandle(el, idx);
    });
    drawInsp();
  }

  function bindCanvasItems(){
    const canvasEl = frame.querySelector('.s-canvas');
    if(canvasEl) canvasEl.addEventListener('pointerdown', e => {
      if(e.target === canvasEl){ selCI = null; selectItem(null); }
    });
    frame.querySelectorAll('.ci').forEach(el => {
      const idx = +el.dataset.ci;
      if(idx === selCI){ el.classList.add('sel'); addHandle(el, idx); }

      el.addEventListener('pointerdown', e => {
        if(el.isContentEditable || e.target.classList.contains('ci-handle')) return;
        e.preventDefault();
        selectItem(idx);
        const it = itemsOf()[idx];
        const ox = it.x | 0, oy = it.y | 0, sx = e.clientX, sy = e.clientY;
        let nx = ox, ny = oy, moved = false;
        const move = ev => {
          nx = ox + (ev.clientX - sx) / frameScale;
          ny = oy + (ev.clientY - sy) / frameScale;
          if(Math.abs(nx - ox) + Math.abs(ny - oy) > 1) moved = true;
          el.style.left = Math.round(nx) + 'px';
          el.style.top = Math.round(ny) + 'px';
        };
        const up = () => {
          removeEventListener('pointermove', move); removeEventListener('pointerup', up);
          if(moved){ edit(() => { it.x = Math.round(nx); it.y = Math.round(ny); }); syncCard(); }
        };
        addEventListener('pointermove', move); addEventListener('pointerup', up);
      });

      if(el.classList.contains('ci-text')){
        el.addEventListener('dblclick', () => {
          el.setAttribute('contenteditable', 'true'); el.focus();
          el.oninput = () => { editText(() => { itemsOf()[idx].text = el.innerHTML; }); syncCard(); };
          el.onblur = () => el.removeAttribute('contenteditable');
        });
      }
    });
  }

  function addItem(it){
    edit(() => { itemsOf().push(it); });
    selCI = itemsOf().length - 1;
    drawAll();
  }
  function delItem(){
    if(selCI == null) return;
    edit(() => { itemsOf().splice(selCI, 1); });
    selCI = null; drawAll();
  }
  function setItemProp(patch){
    if(selCI == null) return;
    edit(() => { Object.assign(itemsOf()[selCI], patch); });
    drawFrame(); drawInsp(); syncCard();
  }

  const rgbToHex = c => {
    const m = String(c || '').match(/\d+/g);
    return m ? '#' + m.slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('') : '#0A1334';
  };

  /* 이 장을 자유배치(canvas)로 — 현재 렌더된 요소의 실제 위치를 재서 그대로 옮길 수
     있는 캔버스 요소로 바꿉니다. [data-f] 필드는 텍스트/표 블록으로, 그 외(자유/임포트)
     레이아웃은 통째로 하나의 html 블록으로. 노트·로고·글꼴은 유지합니다. */
  function convertToCanvas(){
    const s = DECK_SLIDES[cur];
    if(s.layout === 'canvas') return;
    const sr = frame.getBoundingClientRect(), sc = frameScale || 1;
    const items = [];
    frame.querySelectorAll('[data-f]').forEach(el => {
      const r = el.getBoundingClientRect();
      const x = Math.round((r.left - sr.left) / sc), y = Math.round((r.top - sr.top) / sc);
      const w = Math.round(r.width / sc), h = Math.round(r.height / sc);
      const cs = getComputedStyle(el);
      if(el.dataset.kind === 'table'){
        items.push({ type: 'html', x, y, w, h, html: el.outerHTML });
      }else{
        items.push({ type: 'text', x, y, w, size: Math.round(parseFloat(cs.fontSize)) || 32,
          color: rgbToHex(cs.color), weight: cs.fontWeight || 700, align: cs.textAlign || 'left', text: el.innerHTML });
      }
    });
    if(!items.length){
      const L = LAYOUTS[s.layout] || LAYOUTS.html;
      items.push({ type: 'html', x: 0, y: 0, w: 1600, h: 900, html: L.render(s) });
    }
    /* 원본 배경(표지 네이비 등)을 뒤에 깔아 흰 텍스트가 안 사라지게 */
    const root = frame.querySelector('.s') || frame.firstElementChild;
    const bg = root ? getComputedStyle(root).backgroundColor : '';
    if(bg && !/rgba?\(0,\s*0,\s*0,\s*0\)|rgb\(255,\s*255,\s*255\)/.test(bg)){
      items.unshift({ type: 'rect', x: 0, y: 0, w: 1600, h: 900, fill: rgbToHex(bg), r: 0 });
    }
    edit(() => {
      const keep = { notes: s.notes, logo: s.logo, logoPos: s.logoPos, logoH: s.logoH, font: s.font };
      DECK_SLIDES[cur] = Object.assign({ layout: 'canvas', items }, keep);
    });
    selCI = null;
    drawAll();
  }

  /* 표 안에서 Tab — 다음 칸으로, 마지막 칸이면 행 추가 (엑셀과 같은 동작).
     이 핸들러는 아래 캡처 단계 keydown에서 호출됩니다. 셀에 직접 붙이면
     엔진 단축키를 막는 stopPropagation에 함께 막혀 절대 안 불립니다. */
  function tabCell(e){
    const td = e.target.closest && e.target.closest('[data-cell]');
    if(!td) return false;
    const tb = td.closest('table[data-f]');
    if(!tb) return false;
    e.preventDefault();
    const cells = [...tb.querySelectorAll('[data-cell]')];
    const at = cells.indexOf(td) + (e.shiftKey ? -1 : 1);
    if(at >= 0 && at < cells.length){ cells[at].focus(); document.execCommand('selectAll'); return true; }
    if(e.shiftKey) return true;
    const s = DECK_SLIDES[cur], f = tb.dataset.f;
    const n = tb.tHead ? tb.tHead.rows[0].cells.length : 3;
    edit(() => { s[f] = (s[f] || '') + '\n' + Array(n).fill(' ').join(' | '); });
    drawFrame(); mirror(f, s[f]); syncCard();
    const c2 = frame.querySelectorAll('tbody [data-cell]');
    c2[c2.length - n] && c2[c2.length - n].focus();
    return true;
  }

  function drawFrame(){
    frame.innerHTML = slideHTML(DECK_SLIDES[cur]);
    bindCanvas();
    fitFrame();
  }

  /* ── 그림 끌어다 놓기 ──
     원본을 그대로 base64로 박으면 덱 파일이 수 MB로 불어나므로,
     1600px 폭으로 줄이고 JPEG로 다시 인코딩합니다. */
  function shrink(file){
    return new Promise((ok, no) => {
      const r = new FileReader();
      r.onerror = no;
      r.onload = () => {
        const img = new Image();
        img.onerror = no;
        img.onload = () => {
          const k = Math.min(1, 1600 / img.width);
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          const png = /png/i.test(file.type);
          ok(cv.toDataURL(png ? 'image/png' : 'image/jpeg', 0.85));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
  stage.addEventListener('dragover', e => {
    if(!EDIT || !e.dataTransfer.types.includes('Files')) return;
    e.preventDefault(); stage.classList.add('over');
  });
  stage.addEventListener('dragleave', e => { if(e.target === stage) stage.classList.remove('over'); });
  stage.addEventListener('drop', async e => {
    if(!e.dataTransfer.files.length) return;
    e.preventDefault(); stage.classList.remove('over');
    const f = [...e.dataTransfer.files].find(x => /^image\//.test(x.type));
    if(!f) return;
    let url;
    try{ url = await shrink(f); }
    catch(err){ alert('그림을 읽지 못했어요.'); return; }
    edit(() => {
      const s = DECK_SLIDES[cur];
      if(s.layout !== 'image'){ s.layout = 'image'; s.title = s.title || ''; s.caption = s.caption || ''; }
      s.src = url;
    });
    drawAll();
  });

  /* 파일 선택으로 그림 넣기 — 드래그가 어려운 상황(로고 등)용.
     드롭과 같은 shrink()를 거쳐 base64로 인라인됩니다. */
  function pickImage(cb){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if(!f) return;
      let url;
      try{ url = await shrink(f); }
      catch(err){ alert('그림을 읽지 못했어요.'); return; }
      cb(url);
    };
    inp.click();
  }

  /* 내 폰트 파일 → base64 @font-face로 덱에 내장(오프라인 유지) → 글꼴 목록에 추가.
     DECK.fonts에 담기고 초안(touch)·[데이터로 저장](deckData)으로 함께 저장됩니다. */
  function pickFont(cb){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.ttf,.otf,.woff,.woff2,font/*';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onerror = () => alert('폰트를 읽지 못했어요.');
      r.onload = () => {
        const name = f.name.replace(/\.(ttf|otf|woff2?|eot)$/i, '').replace(/[^a-zA-Z0-9가-힣_-]+/g, '') || 'MyFont';
        if(!DECK.fonts) DECK.fonts = {};
        DECK.fonts[name] = r.result;       // data URL
        injectFonts(DECK.fonts);           // render.js에 정의(공유 스코프)
        touch();                           // 초안에 폰트까지 저장
        cb(name);
      };
      r.readAsDataURL(f);
    };
    inp.click();
  }

  /* ── 슬라이드 조작 ── */
  const BLANK = {

  /* 레이아웃 고르기 메뉴 */
  const menu = $('edMenu');
  Object.keys(LAYOUTS).forEach(k => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = LAYOUTS[k].label;
    b.onclick = () => { menu.classList.remove('on'); add(k); };
    menu.appendChild(b);
  });
  $('edAddMenu').onclick = e => { e.stopPropagation(); menu.classList.toggle('on'); };
  addEventListener('click', () => menu.classList.remove('on'));

  /* ══ 글자 서식 미니 툴바 ══════════════════════════════════
     선택 영역 위에 떠서 색·굵기를 입힙니다. execCommand가 contenteditable의
     innerHTML을 바꾸고 input 이벤트를 쏘므로, 저장은 기존 input 핸들러(editText)를
     그대로 탑니다 — 상태 관문을 우회하지 않습니다. 버튼 mousedown에서
     preventDefault로 선택을 잃지 않게 합니다. ═══════════════════════ */
  const fmt = document.createElement('div');
  fmt.id = 'edFmt';
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const COLORS = [['본문','--ink'],['파랑','--g1'],['주황','--g2'],['회색','--muted']];
  fmt.innerHTML =
    `<button data-c="bold" title="굵게 ⌘B"><b>B</b></button>`
    + `<button data-c="italic" title="기울임 ⌘I"><i>I</i></button>`
    + `<span class="sep"></span>`
    + COLORS.map(([t,v]) => `<button class="sw" data-color="${cssVar(v)}" title="${t}" style="background:${cssVar(v)}"></button>`).join('')
    + `<label class="cpick" title="색 직접 고르기"><input type="color" value="#0A1334"><span>＋</span></label>`
    + `<span class="sep"></span>`
    + `<button data-c="removeFormat" title="서식 지우기">✕</button>`;
  document.body.appendChild(fmt);
  let fmtRange = null;   /* 컬러 피커가 열릴 때 선택이 풀리므로 범위를 보관 */
  fmt.querySelector('.cpick input').addEventListener('input', e => {
    try{ if(fmtRange){ const s = getSelection(); s.removeAllRanges(); s.addRange(fmtRange); } }catch(_){}
    applyFmt('foreColor', e.target.value);
  });

  function editableHost(){
    const sel = getSelection();
    if(!sel || !sel.rangeCount) return null;
    let n = sel.anchorNode;
    n = n && (n.nodeType === 1 ? n : n.parentElement);
    const h = n && n.closest('[data-f][contenteditable="true"]');
    return (h && frame.contains(h)) ? h : null;
  }
  function applyFmt(cmd, val){
    const host = editableHost();
    if(!host) return;
    document.execCommand('styleWithCSS', false, true);   /* <font> 대신 <span style> */
    document.execCommand(cmd, false, val);
    host.dispatchEvent(new Event('input', { bubbles:true }));   /* editText 경로로 저장 */
  }
  fmt.addEventListener('mousedown', e => {
    const b = e.target.closest('button'); if(!b) return;
    e.preventDefault();   /* 선택 유지 */
    if(b.dataset.color) applyFmt('foreColor', b.dataset.color);
    else applyFmt(b.dataset.c);
  });
  function updateFmt(){
    const sel = getSelection();
    const host = editableHost();
    if(!EDIT || !host || sel.isCollapsed){ fmt.classList.remove('on'); return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    if(!r.width && !r.height){ fmt.classList.remove('on'); return; }
    fmt.classList.add('on');
    fmtRange = sel.getRangeAt(0).cloneRange();
    const fr = fmt.getBoundingClientRect();
    let x = Math.max(8, Math.min(innerWidth - fr.width - 8, r.left + r.width/2 - fr.width/2));
    let y = r.top - fr.height - 8;
    if(y < 8) y = r.bottom + 8;
    fmt.style.left = x + 'px';
    fmt.style.top = y + 'px';
  }
  document.addEventListener('selectionchange', updateFmt);
  stage.addEventListener('scroll', () => fmt.classList.remove('on'), true);

  /* ── 모드 전환 ── */
  function open(){ EDIT = true; document.body.classList.add('editing'); drawAll(); }
  function close(){ flush(); location.hash = ''; location.reload(); }

  enterBtn.onclick = open;
  $('edExit').onclick = close;
  $('edAdd').onclick = () => add('bullets');
  $('edUndo').onclick = undo;
  $('edRedo').onclick = redo;
  $('edReset').onclick = () => {
    if(!confirm('이 브라우저에 저장된 편집 내용을 버리고, 파일에 적힌 원본으로 되돌릴까요?')) return;
    localStorage.removeItem(DRAFT_KEY);
    location.hash = ''; location.reload();
  };

  /* ── 편집 중엔 엔진 단축키를 막음 ──
     엔진은 window의 버블 단계에서 keydown을 듣고 INPUT/TEXTAREA만 예외
     처리합니다. contenteditable은 예외가 아니라서, 캡처 단계에서 먼저
     가로채 전파를 끊습니다. (기본 동작은 살아 있어 타이핑은 정상) */
  addEventListener('keydown', e => {
    if(!EDIT) return;
    const mod = e.metaKey || e.ctrlKey;
    if(e.key === 'Escape'){ e.preventDefault(); close(); }
    else if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); }
    else if(mod && e.key.toLowerCase() === 'm'){ e.preventDefault(); add('bullets'); }
    else if(mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); dup(); }
    else if(mod && e.key.toLowerCase() === 'b'){ if(editableHost()){ e.preventDefault(); applyFmt('bold'); } }
    else if(mod && e.key.toLowerCase() === 'i'){ if(editableHost()){ e.preventDefault(); applyFmt('italic'); } }
    else if(e.key === 'Delete' && selCI != null && DECK_SLIDES[cur].layout === 'canvas'
      && !(document.activeElement && document.activeElement.isContentEditable)){ e.preventDefault(); delItem(); }
    else if(e.key === 'Tab'){ tabCell(e); }
    e.stopPropagation();
  }, true);

  /* ── 내보내기 ──
     <script>의 textContent는 실행돼도 바뀌지 않으므로, 살아 있는 DOM에서
     원본 소스를 그대로 꺼내 재조립합니다. 엔진이 실행 중 주입한 DOM은
     섞이지 않습니다. */
  const esc = t => t.replace(/<\/script/gi, '<\\/script');
  const src = id => '<scr' + 'ipt id="' + id + '">' + esc(document.getElementById(id).textContent) + '</scr' + 'ipt>';

  function done(){
    localStorage.removeItem(DRAFT_KEY);   /* 내보냈으면 초안은 역할 끝 */
    document.body.classList.remove('dirty');
  }
  /* 저장 — 폴더 접근이 되면 파일에 바로 덮어씁니다 (다운로드 폴더를 안 거침).
     showSaveFilePicker의 id별로 크롬이 마지막 폴더를 기억하므로, 두 번째부터는
     저장 창이 decks/ 에서 열립니다. 안 되는 브라우저는 기존 다운로드로 폴백. */
  async function put(text, name, mime, ext, pickerId){
    if(window.showSaveFilePicker){
      try{
        const h = await showSaveFilePicker({ suggestedName: name, id: pickerId,
          types: [{ description: ext, accept: { [mime]: ['.' + ext] } }] });
        const w = await h.createWritable();
        await w.write(text); await w.close();
        done(); return;
      }catch(e){
        if(e.name === 'AbortError') return;            /* 사용자가 취소 */
        console.warn('폴더 저장 실패 — 다운로드로 갑니다', e);
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    done();
  }
  function deckData(){
    const { built, ...meta } = DECK;
    return '/* 슬라이드 데이터 — [\u270e 편집]으로 고치거나 이 배열을 직접 고치세요 */\n'
      + 'const DECK = ' + JSON.stringify(meta, null, 2) + ';\n\n'
      + 'const SLIDES = ' + JSON.stringify(DECK_SLIDES, null, 2) + ';\n';
  }
  function exportData(){ put(deckData(), DECK.id + '.js', 'text/javascript', 'js', 'deck-src'); }
  function exportHTML(){
    /* 엔진이 <title>을 "3/7 — 제목"으로 계속 고쳐 쓰므로 되돌린 뒤 head를 뜹니다. */
    document.querySelector('title').textContent = DECK.title;
    const data = deckData() + "DECK.built = '" + (DECK.built || '') + "';\n";
    const html = '<!DOCTYPE html>\n<html lang="ko">\n<head>' + document.head.innerHTML + '</head>\n'
      + '<body><div class="deck"><div class="deck-inner" id="inner"></div></div>\n'
      + document.querySelector('.nav').outerHTML + '\n'
      + document.getElementById('presenterBtn').outerHTML + '\n'
      + '<scr' + 'ipt id="deckData">\n' + esc(data) + '</scr' + 'ipt>\n'
      + src('deckRender') + '\n' + src('deckEngine') + '\n' + src('deckEditor') + '\n'
      + '</body>\n</html>';
    put(html, DECK.id + '.html', 'text/html', 'html', 'deck-dist');
  }
  $('edSaveData').onclick = exportData;
  $('edSave').onclick = exportHTML;

  if(location.hash.indexOf('edit') !== -1) open();
})();
</script>
</body></html>
