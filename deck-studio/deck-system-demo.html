<script id="deckRender">
/* ══════════════════════════════════════════════════════════════
   레이아웃 정의 — 덱과 아카이브 색인이 함께 씁니다.
   data-f="필드명"이 붙은 요소가 캔버스에서 직접 고칠 수 있는 칸입니다.
   ══════════════════════════════════════════════════════════════ */
const T = 'text', A = 'area';
const LAYOUTS = {
  title:{ label:'표지', fields:[['title',T,'제목'],['sub',T,'부제'],['meta',T,'발표자·소속·일자']],
    render:s=>`<div class="s s-title">
      <div class="s-h" data-f="title">${s.title||''}</div>
      <div class="s-rule"></div>
      <div class="s-sub" data-f="sub">${s.sub||''}</div>
      <div class="s-meta" data-f="meta">${s.meta||''}</div>
    </div>` },

  section:{ label:'구분', fields:[['num',T,'번호'],['title',T,'제목'],['sub',T,'한 줄 요약']],
    render:s=>`<div class="s s-section">
      <div class="s-num" data-f="num">${s.num||''}</div>
      <div class="s-h" data-f="title">${s.title||''}</div>
      <div class="s-sub" data-f="sub">${s.sub||''}</div>
    </div>` },

  bullets:{ label:'불릿', fields:[['eyebrow',T,'윗머리'],['title',T,'제목'],['items',A,'항목 — 한 줄에 하나']],
    render:s=>`<div class="s">
      <div class="s-eyebrow" data-f="eyebrow">${s.eyebrow||''}</div>
      <div class="s-h" data-f="title">${s.title||''}</div>
      <div class="s-rule"></div>
      <div class="s-body"><ul class="s-list" data-f="items" data-kind="list">${
        (lines(s.items).length?lines(s.items):['']).map(t=>`<li>${t||'<br>'}</li>`).join('')}</ul></div>
    </div>` },

  two:{ label:'2단', fields:[['title',T,'제목'],['leftHead',T,'왼쪽 머리'],['left',A,'왼쪽 본문'],['rightHead',T,'오른쪽 머리'],['right',A,'오른쪽 본문']],
    render:s=>`<div class="s">
      <div class="s-h" data-f="title">${s.title||''}</div>
      <div class="s-rule"></div>
      <div class="s-two">
        <div class="s-col"><div class="s-colh" data-f="leftHead">${s.leftHead||''}</div><div data-f="left">${s.left||''}</div></div>
        <div class="s-col"><div class="s-colh" data-f="rightHead">${s.rightHead||''}</div><div data-f="right">${s.right||''}</div></div>
      </div>
    </div>` },

  table:{ label:'표', fields:[['title',T,'제목'],['caption',T,'자료 출처·표본'],['table',A,'표 — 첫 줄이 머리글, 칸은 | 로 구분']],
    render:s=>{
      const rows = lines(s.table).map(r=>r.split('|').map(c=>c.trim()));
      const head = rows.shift()||[];
      return `<div class="s">
        <div class="s-h" data-f="title">${s.title||''}</div>
        <div class="s-rule"></div>
        <div class="s-body"><table class="s-table" data-f="table" data-kind="table">
          <caption data-f="caption">${s.caption||''}</caption>
          <thead><tr>${head.map(c=>`<th data-cell>${c}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td data-cell>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    } },

  image:{ label:'그림', fields:[['title',T,'제목'],['src',T,'파일명 — 덱과 같은 폴더에 두세요'],['caption',T,'캡션']],
    render:s=>`<div class="s">
      <div class="s-h" data-f="title">${s.title||''}</div>
      <div class="s-rule"></div>
      <div class="s-img">${s.src?`<img src="${s.src}" alt="${(s.caption||'').replace(/"/g,'&quot;')}">`
        :`<div style="color:var(--muted);font-size:22px;">오른쪽 칸에 그림 파일명을 넣으세요</div>`}</div>
      <div class="s-cap" data-f="caption">${s.caption||''}</div>
    </div>` },

  quote:{ label:'인용', fields:[['quote',T,'인용문'],['cite',T,'출처']],
    render:s=>`<div class="s s-quote">
      <div class="s-q" data-f="quote">${s.quote||''}</div>
      <div class="s-cite" data-f="cite">${s.cite||''}</div>
    </div>` },

  html:{ label:'자유', fields:[['html',A,'HTML — 1600×900 기준']],
    render:s=>s.html||'<div class="s"><div class="s-body" style="color:var(--muted);">빈 슬라이드</div></div>' },

  /* 캔버스 — 요소를 1600×900 위 절대좌표로 자유 배치. items 배열이 원본.
     편집기가 드래그·크기조절·인라인편집을 붙입니다(모두 edit()/editText() 관문). */
  canvas:{ label:'캔버스', fields:[],
    render:s=>`<div class="s s-canvas">${(Array.isArray(s.items)?s.items:[]).map(renderItem).join('')}</div>` }
};

function renderItem(it, i){
  const pos = `position:absolute;left:${it.x|0}px;top:${it.y|0}px;`;
  if(it.type === 'rect'){
    return `<div class="ci ci-rect" data-ci="${i}" style="${pos}width:${it.w||220}px;height:${it.h||130}px;`
      + `background:${it.fill||'#1F6FEB'};border-radius:${it.r==null?14:it.r}px;`
      + `${it.stroke?`border:${it.sw||3}px solid ${it.stroke};`:''}"></div>`;
  }
  if(it.type === 'ellipse'){
    return `<div class="ci ci-rect" data-ci="${i}" style="${pos}width:${it.w||180}px;height:${it.h||180}px;`
      + `background:${it.fill||'#D4700E'};border-radius:50%;`
      + `${it.stroke?`border:${it.sw||3}px solid ${it.stroke};`:''}"></div>`;
  }
  if(it.type === 'image'){
    return `<div class="ci ci-image" data-ci="${i}" style="${pos}width:${it.w||360}px;">`
      + `<img src="${it.src||''}" style="width:100%;display:block;border-radius:${it.r||0}px;" alt=""></div>`;
  }
  if(it.type === 'html'){
    return `<div class="ci ci-html" data-ci="${i}" style="${pos}width:${it.w||600}px;height:${it.h||300}px;overflow:hidden;">${it.html||''}</div>`;
  }
  return `<div class="ci ci-text" data-ci="${i}" data-ck="text" style="${pos}width:${it.w||460}px;`
    + `font-size:${it.size||40}px;color:${it.color||'#0A1334'};font-weight:${it.weight||700};`
    + `text-align:${it.align||'left'};line-height:1.3;">${it.text||''}</div>`;
}

function lines(v){ return String(v||'').split('\n').filter(t=>t.trim()!==''); }

/* 로고/브랜드 마크 — 레이아웃과 무관하게 슬라이드 위에 얹습니다.
   base64 data URI라 외부 리소스 규칙을 안 깹니다. 발표·편집 캔버스·썸네일이
   모두 slideHTML을 거치므로 여기 한 곳이면 세 경로에 일관되게 나옵니다. */
function slideLogo(s){
  if(!s || !s.logo) return '';
  const pos = ({tl:'tl',tr:'tr',bl:'bl',br:'br'})[s.logoPos] || 'br';
  const h = Math.max(24, Math.min(240, +s.logoH || 72));
  return `<img class="deck-logo ${pos}" style="--logo-h:${h}px" src="${s.logo}" alt="">`;
}

/* 글꼴 — 외부 리소스 규칙(철칙 4) 때문에 시스템 상주 폰트만. 한글은 고딕/명조/모노가
   어느 OS에서도 안전합니다. 개성 있는 폰트는 별도로 base64 번들해야 합니다. */
const FONTS = {
  sans:  "'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif",
  serif: "'Nanum Myeongjo','AppleMyungjo','Batang',serif",
  round: "'Gulim','굴림','Apple SD Gothic Neo',sans-serif",
  brush: "'Gungsuh','궁서','AppleMyungjo',serif",
  mono:  "'D2Coding','Consolas','Menlo',monospace"
};

function slideHTML(s){
  const L = LAYOUTS[s.layout] || LAYOUTS.html;
  let html = L.render(s) + slideLogo(s);
  const st = [], cls = [];
  if(s && s.font){
    /* 내장 스택이면 그걸, 아니면 업로드한 커스텀 폰트명(@font-face는 render/editor가 주입) */
    st.push('font-family:' + (FONTS[s.font] || `'${String(s.font).replace(/'/g, '')}', sans-serif`));
  }
  if(s && s.bg){ cls.push('slidebg'); st.push('background:' + s.bg); }  /* 장 배경색 — .slidebg가 레이아웃 자체 배경을 투명화 */
  /* 모션 — 데이터(s.anim)→클래스. 재생 CSS는 .slide.active 하위로 스코프돼
     발표 화면에서만 움직이고, 편집 캔버스·썸네일(비 .slide 컨테이너)은 정지 상태 */
  if(s && s.anim) cls.push('anim-' + String(s.anim).replace(/[^a-z-]/g, ''));
  /* 요소 위치 오프셋 — 편집 캔버스에서 좌클릭 드래그로 옮긴 값(s.off = {필드:[dx,dy]}).
     transform이라 주변 흐름은 그대로(레이아웃 붕괴 없음). data-f는 필드당 정확히
     1번 나오고 레이아웃이 style 속성을 안 쓰므로 문자열 치환이 안전하다. */
  if(s && s.off){
    for(const f in s.off){
      const o = s.off[f] || [];
      const x = Math.round(+o[0] || 0), y = Math.round(+o[1] || 0);
      if(!x && !y) continue;
      html = html.replace('data-f="' + f + '"',
        'data-f="' + f + '" style="transform:translate(' + x + 'px,' + y + 'px)"');
    }
  }
  if(st.length || cls.length){
    html = `<div class="${cls.join(' ')}" style="position:absolute;inset:0;${st.join(';')}">${html}</div>`;
  }
  return html;
}


/* ══════════════════════════════════════════════════════════════
   덱 부팅 — 엔진보다 먼저 실행돼서 #inner에 슬라이드를 채웁니다.
   (엔진은 로드 시점에 .slide를 한 번만 읽으므로 이 순서가 곧 계약)

   초안(draft)은 브라우저에만 있는 임시 편집본입니다.
   DECK.built는 빌드할 때 찍히는 도장이라, 파일을 다시 빌드하면
   도장이 달라져 낡은 초안이 자동으로 버려집니다 — 항상 파일이 최신입니다.
   ══════════════════════════════════════════════════════════════ */
const DRAFT_KEY = 'deckDraft:' + DECK.id;

let DECK_SLIDES = SLIDES;
let HAS_DRAFT = false;
try{
  const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
  if(d && Array.isArray(d.slides) && d.slides.length){
    if(d.built === DECK.built){ DECK_SLIDES = d.slides; if(d.fonts) DECK.fonts = d.fonts; HAS_DRAFT = true; }
    else localStorage.removeItem(DRAFT_KEY); /* 파일이 다시 빌드됨 — 파일이 이김 */
  }
}catch(e){ /* 초안이 깨졌으면 원본으로 */ }

/* <title>을 DECK.title로 맞춤 — 엔진이 이 값을 발표자 창 이름으로 씁니다.
   DOM의 <title> 요소를 고쳐야 내보낸 파일에도 그대로 담깁니다. */
const _t = document.querySelector('title');
if(_t && DECK.title) _t.textContent = DECK.title;

/* 임포트한 덱은 원본 CSS를 함께 들고 옵니다 (.imported 로 스코프됨).
   엔진/테마보다 뒤에 넣어야 원본 디자인이 이깁니다. */
if(DECK.css){
  const st = document.createElement('style');
  st.id = 'importedCSS';
  st.textContent = DECK.css;
  document.head.appendChild(st);
}

/* 업로드한 커스텀 폰트를 @font-face로 주입 — base64라 오프라인 유지.
   render/editor가 공유(엔진보다 먼저 실행되므로 여기 정의). */
function injectFonts(map){
  if(!map) return;
  const css = Object.keys(map).map(n => `@font-face{font-family:'${n}';src:url(${map[n]});font-display:swap;}`).join('\n');
  let st = document.getElementById('deckFonts');
  if(!st){ st = document.createElement('style'); st.id = 'deckFonts'; document.head.appendChild(st); }
  st.textContent = css;
}
injectFonts(DECK.fonts);

function renderDeck(){
  const host = document.getElementById('inner');
  host.innerHTML = DECK_SLIDES.map((s, i) =>
    `<section class="slide${i === 0 ? ' active' : ''}" data-i="${i}">${slideHTML(s)}</section>`
  ).join('');
}
renderDeck();

/* 발표자 창 화면 맞춤 — 엔진은 썸네일 폭을 localStorage(덱별)에서 읽어 인라인으로 찍으므로
   CSS로는 못 바꿉니다. 엔진보다 먼저, 저장값이 없거나 "우리가 자동으로 넣은 값"일 때만
   현재 화면 폭에 맞는 값을 심습니다. 사용자가 슬라이더로 직접 바꾼 값은 자동값과 달라지므로 존중됩니다. */
if(location.hash.indexOf('presenter') !== -1){
  try{
    const K = 'dfl-presenter-thumbsize-' + DECK.id, A = 'deckAuto:thumb:' + DECK.id;
    const cur = localStorage.getItem(K), auto = localStorage.getItem(A);
    if(cur === null || cur === auto){
      const want = String(Math.max(120, Math.min(224, Math.round(innerWidth * 0.105))));
      localStorage.setItem(K, want); localStorage.setItem(A, want);
    }
  }catch(e){}
}
</script>
<script id="deckEngine">
/* ═══════════════════════════════════════════════════════
   발표자 모드 (Presenter Mode) — DAYFOCUS LAB
   ▸ DECK_ID: 덱마다 고유한 값으로 바꿔주세요 (같은 브라우저에서
     여러 덱을 써도 슬라이드 위치·타이머가 서로 안 섞이게 하는 열쇠)
   ═══════════════════════════════════════════════════════ */
const DECK_ID=DECK.id;
const DECK_TITLE=document.title;

const inner=document.getElementById('inner');const slides=[...document.querySelectorAll('.slide')];
const TOTAL=slides.length;
let i=0;

/* ============================================================
   발표자 노트 데이터 (index = 슬라이드 순서, 0부터)
   노트가 없는 슬라이드는 빈 문자열 ``로 두면 돼요.
   ============================================================ */
const NOTES = DECK_SLIDES.map(s=>s.notes||''); /* 노트는 SLIDES와 한 배열에서 — 번호 밀림 없음 */

/* ============================================================
   [v5] 쉬는 시간(B) 화면 커스터마이즈
   B를 눌렀을 때 검은 화면 대신 뜨는 안내 화면이에요.
   웨비나 대기 화면·브레이크 타임 안내·커뮤니티 QR 등에 쓰세요.
   전부 빈 문자열('')로 두면 기존처럼 순수 검은 화면이 돼요.
   W(흰 화면)는 항상 순수 흰색으로 유지돼요.
   ============================================================ */
const BREAK_SCREEN={
  title:'',        // 큰 제목 (예: '☕ 잠깐 쉬어가요') — 전부 비우면(기본) 순수 검은 화면
  sub:'',          // 부제목 (예: '10분 뒤에 다시 시작할게요' · 줄바꿈은 \n)
  logoText:'',     // 텍스트 로고 (예: 'OO컴퍼니')
  logoImg:'',      // 이미지 로고 경로 (예: 'logo.png') — 있으면 logoText 대신 표시
  qrImg:'',        // QR 이미지 경로 (예: 'qr.png') — 커뮤니티·웹사이트 안내용
  qrLabel:'',      // QR 아래 설명 (예: '오픈채팅 참여하기')
  showClock:false, // 현재 시각 표시
  bgm:''           // 쉬는 시간 배경음악 mp3 경로 (예: 'break.mp3') — ♪ 버튼으로 재생/정지
};

const isPresenter=location.hash.indexOf('presenter')!==-1;

function fit(){applyDeckTransform();} /* [v5.1] 기본 스케일 + 구역 확대 상태를 함께 반영 */
let _dwellStart=Date.now(),_lastIdx=-1;
function render(){
  slides.forEach((s,j)=>s.classList.toggle('active',j===i));
  if(i!==_lastIdx){_lastIdx=i;_dwellStart=Date.now();} /* [v3-9] 슬라이드 체류 시간 리셋 */
  if(isPresenter)renderPresenter();
  else{
    document.title=(i+1)+'/'+TOTAL+' — '+DECK_TITLE; /* [v3-24] 청중 창 탭 제목에도 진행 상황 */
    inkRedraw(); /* [v5] 슬라이드별 판서 다시 그리기 */
    magSyncSlide(); /* [v5] 돋보기 내용 갱신 */
  }
}
/* [개선 4] 랩어라운드 제거: 마지막에서 →를 눌러도 처음으로 튀지 않고 경계 토스트만 표시 */
let lastNavLocal=0;
function show(n){
  const c=Math.max(0,Math.min(n,TOTAL-1));
  if(c===i&&n!==i){edgeToast(n>i?'마지막 슬라이드예요':'첫 슬라이드예요');return;}
  i=c;lastNavLocal=Date.now();render();persist(i);
  if(blackoutMode)setBlackout(blackoutMode); /* [v3-6] 슬라이드를 넘기면 블랙아웃 자동 해제 */
  if(zoomRegion)zoomSetRegion(null); /* [v5.1] 구역 확대도 자동 해제 */
}
function applyRemote(n){const ni=Math.max(0,Math.min(n,TOTAL-1));if(ni===i)return;i=ni;render();}

/* ── 양방향 동기화: localStorage(기본) + BroadcastChannel(병행) ── */
const LS_KEY='dfl-presenter-idx-'+DECK_ID;
const BLACK_KEY='dfl-presenter-blackout-'+DECK_ID;
const BC=('BroadcastChannel' in window)?new BroadcastChannel('dfl-presenter-sync-'+DECK_ID):null;
function persist(n){
  try{localStorage.setItem(LS_KEY,String(n));}catch(e){}
  if(BC){try{BC.postMessage({type:'idx',idx:n});}catch(e){}}
}
addEventListener('storage',e=>{
  if(e.key===LS_KEY&&e.newValue!=null)applyRemote(parseInt(e.newValue,10)||0);
  if(e.key===BLACK_KEY)applyBlackoutFromStore();
  if(e.key===INK_MSG_KEY&&e.newValue&&!BC){try{inkRecv(JSON.parse(e.newValue));}catch(err){}} /* [v5] BC 미지원 브라우저 폴백 */
  if(e.key===BREAK_CFG_KEY)breakCfgChanged(); /* [v5.2] 쉬는화면 설정 동기화 */
});
/* [개선 9·30] 하트비트: 발표자 창이 2초마다 ping → 청중 창이 pong + 어긋난 슬라이드 자동 재정렬 */
let lastPong=0,lastPingSeen=0;
if(BC){BC.onmessage=e=>{
  const d=e&&e.data;if(!d)return;
  if(d.type==='idx')applyRemote(d.idx);
  else if(d.type==='ink')inkRecv(d); /* [v5] 판서 동기화 */
  else if(d.type==='zoom'){zoomRegion=d.region||null;applyDeckTransform(true);zoomChipSync();if(!isPresenter&&d.region)edgeToast('🔎 확대 중 — 다시 Z 또는 슬라이드를 넘기면 원위치');} /* [v5.1] 구역 확대 동기화 */
  else if(d.type==='breakcfg')breakCfgChanged(); /* [v5.2] 쉬는화면 설정 동기화 */
  else if(d.type==='blackout'){blackoutMode=(d.mode==='black'||d.mode==='white')?d.mode:null;applyBlackout();}
  else if(d.type==='ping'&&!isPresenter){
    lastPingSeen=Date.now();
    try{BC.postMessage({type:'pong'});}catch(err){}
    /* 드리프트 자동 복구: 청중 창에서 최근 2.5초 내 직접 조작이 없었을 때만 발표자 기준으로 맞춤 */
    if(typeof d.idx==='number'&&d.idx!==i&&Date.now()-lastNavLocal>2500)applyRemote(d.idx);
  }
  else if(d.type==='pong'&&isPresenter)lastPong=Date.now();
};}
/* 발표 진행 중(발표자 창 연결됨)인 청중 창 = 강의장 투사 화면 — 도움말·점프 입력을 청중에게 노출하지 않음 */
function isProjecting(){return !isPresenter&&Date.now()-lastPingSeen<5000;}

/* [개선 5] B/W 블랙아웃 — 강의장 화면을 검게/희게 가리기 (쉬는시간·집중 유도) */
let blackoutMode=null;
function setBlackout(mode){
  blackoutMode=(blackoutMode===mode)?null:mode;
  try{localStorage.setItem(BLACK_KEY,blackoutMode||'');}catch(e){}
  if(BC){try{BC.postMessage({type:'blackout',mode:blackoutMode});}catch(e){}}
  applyBlackout();
}
function applyBlackoutFromStore(){
  try{const v=localStorage.getItem(BLACK_KEY);blackoutMode=(v==='black'||v==='white')?v:null;}catch(e){}
  applyBlackout();
}
function applyBlackout(){
  if(!isPresenter){
    let el=document.getElementById('blackoutOverlay');
    if(!el){
      el=document.createElement('div');el.id='blackoutOverlay';
      el.title='클릭하면 화면이 다시 보여요';
      el.addEventListener('click',()=>setBlackout(blackoutMode));
      document.body.appendChild(el);
    }
    el.style.background=blackoutMode==='white'?'#fff':'#000';
    renderBreakScreen(el); /* [v5] 커스텀 쉬는 시간 화면 */
    el.classList.toggle('on',!!blackoutMode); /* [v3-7] 페이드 전환 */
    bgmSync(); /* [v5] 쉬는 시간 BGM */
  }
  const chip=document.getElementById('pBlackChip');
  if(chip){
    chip.style.display=blackoutMode?'inline-block':'none';
    chip.textContent=blackoutMode==='white'?'⬜ 강의장 화면 가림 (흰색) · W 해제':'⬛ 강의장 화면 가림 · B 해제';
  }
  const bb=document.getElementById('pBlackBtn');
  if(bb)bb.textContent=blackoutMode?'⬛ 가림 해제':'⬛ 가리기'; /* [v3-4] 클릭 버튼 상태 */
  if(isPresenter)document.body.classList.toggle('pBlackOn',!!blackoutMode); /* [v3-28] 현재 슬라이드 주황 테두리 */
}

/* ═══ [v5] 쉬는 시간(B) 커스텀 화면 + BGM — 커뮤니티 피드백 반영 ═══
   [v5.2] 코드의 BREAK_SCREEN(기본값) 위에, 발표자 창 [☕ 쉬는화면] 버튼으로 저장한
   설정(localStorage, 덱별)이 덮어써져요 — 코드 수정 없이 누구나 꾸밀 수 있어요. */
const BREAK_CFG_KEY='dfl-presenter-breakcfg-'+DECK_ID;
let _breakOverride=null,_breakLoaded=false;
function breakCfg(){
  if(!_breakLoaded){
    _breakLoaded=true;
    try{_breakOverride=JSON.parse(localStorage.getItem(BREAK_CFG_KEY)||'null');}catch(e){_breakOverride=null;}
  }
  return _breakOverride?Object.assign({},BREAK_SCREEN,_breakOverride):BREAK_SCREEN;
}
function breakCfgChanged(){ /* 설정이 바뀌면 화면·오디오 캐시 무효화 후 즉시 반영 */
  _breakLoaded=false;
  if(bgmAudio){try{bgmAudio.pause();}catch(e){}bgmAudio=null;}
  const el=document.getElementById('blackoutOverlay');
  if(el){
    const w=el.querySelector('.boWrap');if(w)w.remove();
    if(blackoutMode)applyBlackout();else el.classList.remove('boCustom');
  }
}
function breakConfigured(){const B=breakCfg();return !!(B.title||B.sub||B.logoText||B.logoImg||B.qrImg);}
function renderBreakScreen(el){
  const custom=blackoutMode==='black'&&breakConfigured();
  el.classList.toggle('boCustom',custom);
  if(!custom||el.querySelector('.boWrap'))return;
  const B=breakCfg();
  const w=document.createElement('div');w.className='boWrap';
  let h='';
  if(B.logoImg)h+='<img class="boLogoImg" src="'+B.logoImg+'" alt="로고">';
  else if(B.logoText)h+='<div class="boLogoText">'+escHTML(B.logoText)+'</div>';
  if(B.title)h+='<div class="boTitle">'+escHTML(B.title)+'</div>';
  if(B.sub)h+='<div class="boSub">'+escHTML(B.sub).replace(/\n/g,'<br>')+'</div>';
  if(B.showClock)h+='<div class="boClock" id="boClock"></div>';
  if(B.qrImg)h+='<div class="boQrBox"><img class="boQr" src="'+B.qrImg+'" alt="QR 코드">'+(B.qrLabel?'<div class="boQrLabel">'+escHTML(B.qrLabel)+'</div>':'')+'</div>';
  if(B.bgm)h+='<button type="button" id="boBgmBtn">♪ BGM 재생</button>';
  w.innerHTML=h;
  el.appendChild(w);
  const bb=w.querySelector('#boBgmBtn');
  if(bb)bb.addEventListener('click',ev=>{ev.stopPropagation();bgmWant=!(bgmAudio&&!bgmAudio.paused);bgmSync();});
  if(B.showClock){
    const upd=()=>{const c=document.getElementById('boClock');if(!c)return;const d=new Date();c.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
    upd();setInterval(upd,5000);
  }
}
/* BGM: 쉬는 시간(B) 동안 청중 창에서 재생. 브라우저가 자동재생을 막으면 ♪ 버튼으로 수동 시작 */
let bgmAudio=null,bgmWant=true;
function bgmSync(){
  const B=breakCfg();
  if(isPresenter||!B.bgm)return;
  const on=blackoutMode==='black'&&bgmWant;
  if(on){
    if(!bgmAudio){bgmAudio=new Audio(B.bgm);bgmAudio.loop=true;bgmAudio.volume=0.35;}
    bgmAudio.play().then(bgmBtnSync).catch(()=>{edgeToast('브라우저가 자동재생을 막았어요 — 화면의 ♪ 버튼을 눌러주세요');bgmBtnSync();});
  }else if(bgmAudio&&!bgmAudio.paused)bgmAudio.pause();
  bgmBtnSync();
}
function bgmBtnSync(){
  const b=document.getElementById('boBgmBtn');if(!b)return;
  b.textContent=(bgmAudio&&!bgmAudio.paused)?'⏸ BGM 정지':'♪ BGM 재생';
}
/* ═══ [v5.2] ☕ 쉬는화면 설정 모달 (발표자 창) ═══ */
/* [v5.2] 상황별 프리셋 — 클릭 한 번으로 바로 적용, 문구는 폼에서 자유 수정
   title은 청중에게 보이는 안내문(시그니지)이라 의도적으로 격식체(-입니다) 사용 */
const BREAK_PRESETS=[
  {name:'⬛ 검은 화면 (기본)',cfg:{title:'',sub:'',logoText:'',logoImg:'',qrImg:'',qrLabel:'',showClock:false,bgm:''}},
  {name:'☕ 쉬는 시간',cfg:{title:'☕ 쉬는 시간입니다',sub:'잠시 후 다시 시작할게요',logoText:'',logoImg:'',qrImg:'',qrLabel:'',showClock:true,bgm:''}},
  {name:'🍽 점심시간',cfg:{title:'🍽 점심시간입니다',sub:'맛있게 드시고 오세요',logoText:'',logoImg:'',qrImg:'',qrLabel:'',showClock:true,bgm:''}},
  {name:'💻 실습 시간',cfg:{title:'💻 실습 시간입니다',sub:'막히면 편하게 손 들어주세요',logoText:'',logoImg:'',qrImg:'',qrLabel:'',showClock:true,bgm:''}},
  {name:'🙋 Q&A',cfg:{title:'🙋 Q&A 시간입니다',sub:'궁금한 것 편하게 물어봐주세요',logoText:'',logoImg:'',qrImg:'',qrLabel:'',showClock:false,bgm:''}},
  {name:'🕘 곧 시작',cfg:{title:'🕘 곧 시작합니다',sub:'잠시만 기다려주세요',logoText:'',logoImg:'',qrImg:'',qrLabel:'',showClock:true,bgm:''}}
];
function bcMarkActivePreset(){ /* [UX] 현재 적용 중인 프리셋 하이라이트 */
  const el=document.getElementById('breakCfgOverlay');if(!el)return;
  const B=breakCfg();
  const sig=c=>JSON.stringify([c.title||'',c.sub||'',c.logoText||'',c.logoImg||'',c.qrImg||'',c.qrLabel||'',!!c.showClock,c.bgm||'']);
  const cur=sig(B);
  el.querySelectorAll('.bcPreset').forEach((btn,k)=>btn.classList.toggle('on',sig(BREAK_PRESETS[k].cfg)===cur));
}
function bcApply(o,msg){
  try{localStorage.setItem(BREAK_CFG_KEY,JSON.stringify(o));}catch(e){edgeToast('저장 공간이 부족해요 — 이미지 크기를 줄여주세요');return false;}
  if(BC){try{BC.postMessage({type:'breakcfg'});}catch(e){}}
  breakCfgChanged();
  edgeToast(msg||'저장했어요 — B를 눌러 확인해보세요');
  return true;
}
let _bcLogoData,_bcQrData;
function bcFileRow(id,label){
  return '<div class="bcRow"><label>'+label+'</label><div class="bcInline">'+
    '<input type="file" id="'+id+'" accept="image/*" style="font-size:12.5px;max-width:230px;">'+
    '<img class="bcThumb" id="'+id+'Thumb" alt="미리보기">'+
    '<button type="button" class="bcBtn ghost" id="'+id+'Clear" style="padding:6px 10px;font-size:12.5px;">지우기</button>'+
    '</div></div>';
}
function bcBindFile(id,setData,curVal){
  const inp=document.getElementById(id),thumb=document.getElementById(id+'Thumb');
  if(curVal){thumb.src=curVal;thumb.style.display='inline-block';}
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>1500000){edgeToast('이미지가 너무 커요 — 1.5MB 이하로 줄여주세요');inp.value='';return;}
    const rd=new FileReader();
    rd.onload=()=>{setData(rd.result);thumb.src=rd.result;thumb.style.display='inline-block';};
    rd.readAsDataURL(f);
  });
  document.getElementById(id+'Clear').addEventListener('click',()=>{setData('');inp.value='';thumb.style.display='none';});
}
function toggleBreakCfg(force){
  let el=document.getElementById('breakCfgOverlay');
  if(!el){
    el=document.createElement('div');el.id='breakCfgOverlay';
    const B=breakCfg();
    _bcLogoData=undefined;_bcQrData=undefined;
    el.innerHTML='<div class="bcCard">'+
      '<div class="bcTitle">☕ 쉬는 시간(B) 화면 꾸미기</div>'+
      '<div class="bcHint">B를 눌렀을 때 강의장 화면에 뜨는 내용이에요. 프리셋을 고르면 바로 적용되고, 아래 폼에서 자유롭게 고칠 수 있어요.<br>설정은 이 브라우저에 덱별로 저장돼요 (코드 수정 없음).</div>'+
      '<div class="bcPresets">'+BREAK_PRESETS.map((pz,k)=>'<button type="button" class="bcPreset" data-preset="'+k+'">'+pz.name+'</button>').join('')+'</div>'+
      '<div class="bcRow"><label>큰 제목</label><input type="text" id="bcTitle" placeholder="예: ☕ 잠깐 쉬어가요"></div>'+
      '<div class="bcRow"><label>부제목</label><input type="text" id="bcSub" placeholder="예: 10분 뒤에 다시 시작할게요"></div>'+
      '<div class="bcRow"><label>로고 텍스트</label><input type="text" id="bcLogoText" placeholder="예: OO컴퍼니"></div>'+
      bcFileRow('bcLogoImg','로고 이미지 (있으면 텍스트 대신 표시)')+
      bcFileRow('bcQrImg','QR 이미지 (커뮤니티·웹사이트 안내)')+
      '<div class="bcRow"><label>QR 아래 설명</label><input type="text" id="bcQrLabel" placeholder="예: 오픈채팅 참여하기"></div>'+
      '<div class="bcRow"><label class="bcCheck"><input type="checkbox" id="bcClock"> 현재 시각 표시</label></div>'+
      '<div class="bcRow"><label>BGM 파일 경로 (선택)</label><input type="text" id="bcBgm" placeholder="예: break.mp3 — deck 파일과 같은 폴더에 두세요"></div>'+
      '<div class="bcActions">'+
        '<button type="button" class="bcBtn" id="bcSave">저장</button>'+
        '<button type="button" class="bcBtn ghost" id="bcReset">기본(검은 화면)으로 초기화</button>'+
        '<button type="button" class="bcBtn ghost" id="bcClose">닫기</button>'+
      '</div></div>';
    document.body.appendChild(el);
    el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('on');});
    document.getElementById('bcTitle').value=B.title||'';
    document.getElementById('bcSub').value=B.sub||'';
    document.getElementById('bcLogoText').value=B.logoText||'';
    document.getElementById('bcQrLabel').value=B.qrLabel||'';
    document.getElementById('bcClock').checked=!!B.showClock;
    document.getElementById('bcBgm').value=B.bgm||'';
    bcBindFile('bcLogoImg',v=>{_bcLogoData=v;},B.logoImg);
    bcBindFile('bcQrImg',v=>{_bcQrData=v;},B.qrImg);
    el.querySelectorAll('.bcPreset').forEach(btn=>btn.addEventListener('click',()=>{
      const cfg=BREAK_PRESETS[parseInt(btn.dataset.preset,10)].cfg;
      document.getElementById('bcTitle').value=cfg.title;
      document.getElementById('bcSub').value=cfg.sub;
      document.getElementById('bcLogoText').value=cfg.logoText;
      document.getElementById('bcQrLabel').value=cfg.qrLabel;
      document.getElementById('bcClock').checked=cfg.showClock;
      document.getElementById('bcBgm').value=cfg.bgm;
      _bcLogoData='';_bcQrData='';
      document.getElementById('bcLogoImgThumb').style.display='none';
      document.getElementById('bcQrImgThumb').style.display='none';
      const k=parseInt(btn.dataset.preset,10);
      bcApply(Object.assign({},cfg),k===0?'기본(검은 화면)으로 설정했어요':btn.textContent+' 적용됐어요 — B를 눌러 확인해보세요');
      bcMarkActivePreset();
    }));
    document.getElementById('bcClose').addEventListener('click',()=>el.classList.remove('on'));
    document.getElementById('bcSave').addEventListener('click',()=>{
      const B0=breakCfg();
      const o={
        title:document.getElementById('bcTitle').value.trim(),
        sub:document.getElementById('bcSub').value.trim(),
        logoText:document.getElementById('bcLogoText').value.trim(),
        logoImg:(_bcLogoData!==undefined)?_bcLogoData:(B0.logoImg||''),
        qrImg:(_bcQrData!==undefined)?_bcQrData:(B0.qrImg||''),
        qrLabel:document.getElementById('bcQrLabel').value.trim(),
        showClock:document.getElementById('bcClock').checked,
        bgm:document.getElementById('bcBgm').value.trim()
      };
      try{localStorage.setItem(BREAK_CFG_KEY,JSON.stringify(o));}catch(e){edgeToast('저장 공간이 부족해요 — 이미지 크기를 줄여주세요');return;}
      if(BC){try{BC.postMessage({type:'breakcfg'});}catch(e){}}
      breakCfgChanged();
      el.classList.remove('on');
      edgeToast('저장했어요 — B를 눌러 확인해보세요');
    });
    document.getElementById('bcReset').addEventListener('click',()=>{
      try{localStorage.removeItem(BREAK_CFG_KEY);}catch(e){}
      _bcLogoData=undefined;_bcQrData=undefined;
      if(BC){try{BC.postMessage({type:'breakcfg'});}catch(e){}}
      breakCfgChanged();
      el.remove(); /* 폼을 기본값으로 다시 그리기 위해 제거 */
      edgeToast('기본(검은 화면)으로 되돌렸어요');
    });
  }
  const on=(force!==undefined)?force:!el.classList.contains('on');
  el.classList.toggle('on',on);
  if(on)bcMarkActivePreset();
}

/* ═══ [v5] 판서: 펜(D)·형광펜(G)·지우개(E) — 커뮤니티 피드백 반영 ═══
   발표자 창·청중 창 어느 쪽에서 그려도 실시간 동기화.
   좌표는 슬라이드 기준(1600×900)으로 정규화 — 창 크기가 달라도 같은 위치에 그려져요.
   판서는 이 세션에서만 유지돼요(새로고침 시 초기화). */
const INK={};
const INK_COLORS=['#FF3B30','#FF9500','#FFD60A','#17B26A','#2E7CF6','#111111'];
const INK_MSG_KEY='dfl-presenter-inkmsg-'+DECK_ID;
let inkTool=null,inkPenColor='#FF3B30',inkHlColor='#FFD60A';
let inkCur=null,inkLive=null,inkDragging=false,inkSeq=0,_inkLiveT=0;
let pInkCanvas=null; /* 발표자 창 캔버스 — renderPresenter가 현재 슬라이드 박스에 다시 붙임 */
function inkCanvasEl(){return isPresenter?pInkCanvas:document.getElementById('inkCanvas');}
function inkStrokesOf(n){return INK[n]||(INK[n]=[]);}
function inkColorNow(){return inkTool==='hl'?inkHlColor:inkPenColor;}
function inkRedraw(){
  const cv=inkCanvasEl();if(!cv)return;
  let sx=2,sy=2;
  if(isPresenter){
    const w=cv.clientWidth,h=cv.clientHeight;
    if(w<2||h<2)return;
    if(cv.width!==w*2||cv.height!==h*2){cv.width=w*2;cv.height=h*2;}
    sx=cv.width/1600;sy=cv.height/900;
  }
  const ctx=cv.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(sx,0,0,sy,0,0);
  const list=(INK[i]||[]).slice();
  if(inkLive&&inkLive.slide===i)list.push(inkLive.stroke);
  list.forEach(st=>inkPaint(ctx,st));
  if(zoomSelMode&&zoomDrag){ /* [v5.1] 확대 구역 선택 사각형 */
    const zx=Math.min(zoomDrag.a[0],zoomDrag.b[0]),zy=Math.min(zoomDrag.a[1],zoomDrag.b[1]);
    const zw=Math.abs(zoomDrag.a[0]-zoomDrag.b[0]),zh=Math.abs(zoomDrag.a[1]-zoomDrag.b[1]);
    ctx.save();ctx.setLineDash([12,8]);ctx.lineWidth=3;ctx.strokeStyle='#6366F1';ctx.fillStyle='rgba(99,102,241,.12)';
    ctx.fillRect(zx,zy,zw,zh);ctx.strokeRect(zx,zy,zw,zh);ctx.restore();
  }
}
function inkPaint(ctx,st){
  const p=st.pts;if(!p||!p.length)return;
  ctx.globalAlpha=st.t==='hl'?0.38:1;
  ctx.strokeStyle=st.c;ctx.fillStyle=st.c;
  ctx.lineWidth=st.w;ctx.lineCap='round';ctx.lineJoin='round';
  if(p.length===1){ctx.beginPath();ctx.arc(p[0][0],p[0][1],st.w/2,0,Math.PI*2);ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let k=1;k<p.length;k++)ctx.lineTo(p[k][0],p[k][1]);ctx.stroke();}
  ctx.globalAlpha=1;
}
function inkSend(m){
  m=Object.assign({type:'ink'},m);
  if(BC){try{BC.postMessage(m);}catch(e){}}
  else{try{localStorage.setItem(INK_MSG_KEY,JSON.stringify(Object.assign({_n:Date.now()+Math.random()},m)));}catch(e){}}
}
function inkRecv(m){
  if(m.op==='add'){const a=inkStrokesOf(m.slide);if(!a.some(s=>s.id===m.stroke.id))a.push(m.stroke);if(inkLive&&inkLive.stroke.id===m.stroke.id)inkLive=null;if(m.slide===i)inkRedraw();}
  else if(m.op==='live'){inkLive={slide:m.slide,stroke:m.stroke};if(m.slide===i)inkRedraw();}
  else if(m.op==='del'){if(INK[m.slide])INK[m.slide]=INK[m.slide].filter(s=>m.ids.indexOf(s.id)<0);if(m.slide===i)inkRedraw();}
  else if(m.op==='clear'){INK[m.slide]=[];if(inkLive&&inkLive.slide===m.slide)inkLive=null;if(m.slide===i)inkRedraw();}
  else if(m.op==='req'){inkSend({op:'full',data:INK});}
  else if(m.op==='full'){Object.keys(m.data||{}).forEach(k=>{if(!INK[k]||!INK[k].length)INK[k]=m.data[k];});inkRedraw();}
}
function inkPointOf(cv,e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*1600,(e.clientY-r.top)/r.height*900];}
function inkEraseAt(p){
  const a=INK[i];if(!a||!a.length)return;
  const del=[];
  INK[i]=a.filter(st=>{
    const th=st.t==='hl'?28:16;
    const hit=st.pts.some(q=>{const dx=q[0]-p[0],dy=q[1]-p[1];return dx*dx+dy*dy<th*th;});
    if(hit)del.push(st.id);
    return !hit;
  });
  if(del.length){inkSend({op:'del',slide:i,ids:del});inkRedraw();}
}
function inkAttach(cv){
  cv.addEventListener('pointerdown',e=>{
    if(zoomSelMode&&e.button===0){e.preventDefault();e.stopPropagation();try{cv.setPointerCapture(e.pointerId);}catch(err){}zoomDrag={a:inkPointOf(cv,e),b:inkPointOf(cv,e)};inkRedraw();return;} /* [v5.1] */
    if(!inkTool||e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    inkDragging=true;
    const p=inkPointOf(cv,e);
    if(inkTool==='erase'){inkEraseAt(p);return;}
    inkCur={id:'k'+Date.now().toString(36)+'-'+(inkSeq++),t:inkTool,c:inkColorNow(),w:inkTool==='hl'?26:4.5,pts:[p]};
    inkStrokesOf(i).push(inkCur);
    inkRedraw();
  });
  cv.addEventListener('pointermove',e=>{
    if(zoomSelMode){if(zoomDrag){e.preventDefault();zoomDrag.b=inkPointOf(cv,e);inkRedraw();}return;} /* [v5.1] */
    if(!inkDragging||!inkTool)return;
    e.preventDefault();
    const p=inkPointOf(cv,e);
    if(inkTool==='erase'){inkEraseAt(p);return;}
    if(!inkCur)return;
    const last=inkCur.pts[inkCur.pts.length-1];
    if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])<1.2)return;
    inkCur.pts.push(p);
    inkRedraw();
    if(Date.now()-_inkLiveT>60){_inkLiveT=Date.now();inkSend({op:'live',slide:i,stroke:inkCur});}
  });
  function up(){
    if(zoomSelMode){if(zoomDrag)zoomCommit();return;} /* [v5.1] */
    if(!inkDragging)return;
    inkDragging=false;
    if(inkCur){inkSend({op:'add',slide:i,stroke:inkCur});inkCur=null;}
  }
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('click',e=>{if(inkTool||zoomSelMode)e.stopPropagation();}); /* 발표자 창 클릭 네비게이션과 충돌 방지 */
}
function buildInkBar(){
  if(document.getElementById('inkBar'))return;
  const bar=document.createElement('div');bar.id='inkBar';
  const tools=[['pen','✏️ 펜','D'],['hl','🖍️ 형광펜','G'],['erase','⌫ 지우개','E']];
  bar.innerHTML=tools.map(t=>'<button type="button" class="inkBtn" data-tool="'+t[0]+'" title="단축키 '+t[2]+'">'+t[1]+'<span class="inkKbd">'+t[2]+'</span></button>').join('')+
    '<span class="inkSep"></span>'+
    INK_COLORS.map(c=>'<button type="button" class="inkSwatch" data-c="'+c+'" style="background:'+c+'" aria-label="펜 색상 '+c+'" title="펜 색상"></button>').join('')+
    '<span class="inkSep"></span>'+
    '<button type="button" class="inkBtn" id="inkClearBtn" title="이 슬라이드의 판서 모두 지우기">🗑 모두 지우기</button>'+
    '<button type="button" class="inkBtn" id="inkCloseBtn" title="판서 종료 (Esc)">✕ 종료</button>';
  document.body.appendChild(bar);
  bar.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>inkSetTool(b.dataset.tool)));
  bar.querySelectorAll('.inkSwatch').forEach(b=>b.addEventListener('click',()=>{
    if(inkTool==='hl')inkHlColor=b.dataset.c;else inkPenColor=b.dataset.c;
    inkBarSync();
  }));
  document.getElementById('inkClearBtn').addEventListener('click',()=>{INK[i]=[];inkLive=null;inkSend({op:'clear',slide:i});inkRedraw();});
  document.getElementById('inkCloseBtn').addEventListener('click',()=>inkSetTool(null));
}
function inkBarSync(){
  const bar=document.getElementById('inkBar');if(!bar)return;
  bar.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===inkTool));
  const cur=inkColorNow();
  bar.querySelectorAll('.inkSwatch').forEach(b=>b.classList.toggle('on',b.dataset.c===cur));
}
function inkSetTool(t){
  inkTool=(t&&inkTool!==t)?t:null;
  if(inkTool)buildInkBar();
  document.body.classList.toggle('inkOn',!!inkTool);
  document.body.classList.toggle('inkErase',inkTool==='erase'); /* [UX] 지우개 커서 */
  const ib=document.getElementById('pInkBtn'); /* [UX] 버튼 활성 상태 */
  if(ib){ib.classList.toggle('on',!!inkTool);ib.textContent=inkTool?'✏️ 판서 중':'✏️ 판서';}
  inkBarSync();
}

/* ═══ [v5.1] Z — 구역 확대: 드래그한 영역을 화면에 꽉 채워 확대 ═══
   강의장 화면에서 Z → 드래그로 영역 선택. 발표자 창에서도 현재 슬라이드 박스 위에서 선택하면
   강의장 화면이 확대돼요. 다시 Z·Esc·슬라이드 넘기면 원위치. 확대 중 판서·돋보기 조합 가능. */
let zoomRegion=null,zoomSelMode=false,zoomDrag=null;
function applyDeckTransform(anim){
  if(isPresenter||!inner)return;
  if(anim){inner.classList.add('zoomAnim');clearTimeout(window._zoomAnimT);window._zoomAnimT=setTimeout(()=>inner.classList.remove('zoomAnim'),480);}
  const s=Math.min(innerWidth/1600,innerHeight/900);
  if(zoomRegion)inner.style.transform='scale('+(s*zoomRegion.zf)+') translate('+(800-zoomRegion.cx)+'px,'+(450-zoomRegion.cy)+'px)';
  else inner.style.transform='scale('+s+')';
}
function zoomChipSync(){const chip=document.getElementById('pZoomChip');if(chip)chip.style.display=zoomRegion?'inline-block':'none';}
function zoomSetRegion(rg,noSend){
  zoomRegion=rg;
  applyDeckTransform(true);
  zoomChipSync();
  if(!isPresenter&&rg)edgeToast('🔎 확대 중 — 다시 Z 또는 슬라이드를 넘기면 원위치'); /* [UX] */
  if(!noSend&&BC){try{BC.postMessage({type:'zoom',region:rg});}catch(e){}}
}
function zoomSelModeSet(on){
  zoomSelMode=on;zoomDrag=null;
  document.body.classList.toggle('zoomSelMode',on);
  if(on&&inkTool)inkSetTool(null);
  if(on)edgeToast('🔎 확대할 구역을 드래그로 선택하세요 · 클릭 = 2배 · Z 취소');
  inkRedraw();
}
function zoomToggle(){
  if(zoomRegion||zoomSelMode){zoomSelModeSet(false);if(zoomRegion)zoomSetRegion(null);}
  else zoomSelModeSet(true);
}
function zoomCommit(){
  const a=zoomDrag.a,b=zoomDrag.b;zoomDrag=null;
  const x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(a[0]-b[0]),h=Math.abs(a[1]-b[1]);
  let cx,cy,zf;
  if(w<30&&h<30){zf=2;cx=(a[0]+b[0])/2;cy=(a[1]+b[1])/2;} /* 클릭 = 그 지점 2배 */
  else{zf=Math.max(1.15,Math.min(5,Math.min(1600/Math.max(w,40),900/Math.max(h,24))));cx=x+w/2;cy=y+h/2;}
  cx=Math.max(800/zf,Math.min(1600-800/zf,cx)); /* 슬라이드 밖이 보이지 않게 중심 보정 */
  cy=Math.max(450/zf,Math.min(900-450/zf,cy));
  zoomSelModeSet(false);
  zoomSetRegion({cx:Math.round(cx),cy:Math.round(cy),zf:Math.round(zf*100)/100});
}

/* ═══ [v5] M — 마우스 돋보기 (청중 창, 휠로 배율 조절) — 커뮤니티 피드백 반영 ═══ */
let magOn=false,magZoom=2,magEl=null,magInnerEl=null,magChip=null,_magLast=null;
function magBuild(){
  magEl=document.createElement('div');magEl.id='magLens';
  magInnerEl=document.createElement('div');magInnerEl.className='magInner';
  magEl.appendChild(magInnerEl);
  document.body.appendChild(magEl);
  magChip=document.createElement('div');magChip.id='magChip';
  document.body.appendChild(magChip);
  addEventListener('mousemove',e=>{_magLast=[e.clientX,e.clientY];if(magOn)magPlace(e.clientX,e.clientY);},{passive:true});
  addEventListener('wheel',e=>{
    if(!magOn)return;
    e.preventDefault();
    magZoom=Math.max(1.5,Math.min(4,magZoom+(e.deltaY<0?0.25:-0.25)));
    magChipShow();
    if(_magLast)magPlace(_magLast[0],_magLast[1]);
  },{passive:false});
}
function magSyncSlide(){
  if(!magInnerEl||!magOn)return;
  magInnerEl.innerHTML='';
  const cl=slides[i].cloneNode(true);
  /* 클론이 .slide.active로 남으면 덱의 등장 애니메이션이 '전체 활성(PDF) 모드'로 오인함 — 전용 클래스로 교체 */
  cl.classList.remove('slide');cl.classList.remove('active');cl.classList.add('magSlideClone');
  magInnerEl.appendChild(cl);
  if(_magLast)magPlace(_magLast[0],_magLast[1]);
}
function magPlace(mx,my){
  if(!magEl)return;
  const r=inner.getBoundingClientRect();
  const R=170;
  magEl.style.left=(mx-R)+'px';magEl.style.top=(my-R)+'px';
  magChip.style.left=(mx+R*0.55)+'px';magChip.style.top=(my+R*0.72)+'px';
  const s=r.width/1600;if(!s)return;
  const cx=Math.max(0,Math.min(1600,(mx-r.left)/s));
  const cy=Math.max(0,Math.min(900,(my-r.top)/s));
  const z=s*magZoom;
  magInnerEl.style.transform='translate('+(R-cx*z)+'px,'+(R-cy*z)+'px) scale('+z+')';
}
function magChipShow(){
  if(!magChip)return;
  magChip.textContent='×'+String(magZoom).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  magChip.style.display='block';
  clearTimeout(window._magChipT);
  window._magChipT=setTimeout(()=>{magChip.style.display='none';},1200);
}
function magToggle(){
  if(isPresenter){edgeToast('🔍 돋보기는 강의장 화면을 클릭한 뒤 M — 발표자 창에서는 Z(구역 확대)를 쓰세요');return;}
  magOn=!magOn;
  if(magOn){
    if(!magEl)magBuild();
    magSyncSlide();
    magEl.style.display='block';
    if(_magLast)magPlace(_magLast[0],_magLast[1]);
    magChipShow();
    edgeToast('🔍 돋보기 켜짐 — 휠로 배율 조절 · M 으로 끄기');
  }else{
    if(magEl)magEl.style.display='none';
    if(magChip)magChip.style.display='none';
    if(magInnerEl)magInnerEl.innerHTML=''; /* 클론 잔존 방지 */
  }
}

/* [개선 11] Wake Lock — 발표 중 화면 꺼짐·화면보호기 방지 */
function requestWakeLock(){
  if(!('wakeLock' in navigator))return;
  try{navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock();});
requestWakeLock();

/* [개선 6] F 키 전체화면 토글 — ⌃⌘F를 몰라도 됨 */
function toggleFullscreen(){
  if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});}
  else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
}

/* [개선 4] 경계 토스트 */
function edgeToast(msg){
  let el=document.getElementById('edgeToast');
  if(!el){el=document.createElement('div');el.id='edgeToast';el.className='pMiniToast';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('on');
  clearTimeout(window._edgeT);window._edgeT=setTimeout(()=>el.classList.remove('on'),1400);
}
/* [개선 3] 숫자 + Enter 슬라이드 점프 */
let jumpBuf='';
function updateJumpToast(){
  let el=document.getElementById('jumpToast');
  if(!el){el=document.createElement('div');el.id='jumpToast';el.className='pMiniToast';document.body.appendChild(el);}
  if(jumpBuf){
    const n=parseInt(jumpBuf,10);
    const bad=!(n>=1&&n<=TOTAL);
    el.textContent=bad?('슬라이드 '+jumpBuf+' — 없는 번호예요 (1~'+TOTAL+')'):('슬라이드 '+jumpBuf+' — Enter로 이동 · Esc 취소');
    el.classList.toggle('bad',bad); /* [v3-21] 범위 밖 즉시 표시 */
    el.classList.add('on');
  }
  else{el.classList.remove('on');el.classList.remove('bad');}
}
function jumpDigit(d){
  if(isProjecting())return; /* [CCO] 발표 중 강의장 화면엔 점프 입력창 노출 금지 — 점프는 발표자 창에서 */
  jumpBuf=(jumpBuf+d).slice(0,3);
  clearTimeout(window._jumpT);window._jumpT=setTimeout(()=>{jumpBuf='';updateJumpToast();},4000);
  updateJumpToast();
}
function jumpCommit(){
  const n=parseInt(jumpBuf,10);jumpBuf='';updateJumpToast();clearTimeout(window._jumpT);
  if(n>=1&&n<=TOTAL)show(n-1);
  else if(n)edgeToast('1~'+TOTAL+' 사이 번호를 입력해주세요');
}

/* [개선 7] ? 또는 H — 단축키 도움말 오버레이 */
function toggleHelp(force){
  if(force!==false&&isProjecting())return; /* [CCO] 발표 중 강의장 화면엔 도움말 노출 금지 — 도움말은 발표자 창에서 */
  let el=document.getElementById('helpOverlay');
  if(!el){
    el=document.createElement('div');el.id='helpOverlay';
    const sec=t=>'<tr><td colspan="2" class="pHelpSec">'+t+'</td></tr>';

/* ── P 키: 발표자 창 띄우기 ── */
/* [개선 10] 팝업 차단 안내에 원클릭 [다시 열기] 버튼 — 허용 후 바로 복구 */
function showPopupWarning(){
  let el=document.getElementById('popupWarn');
  if(!el){
    el=document.createElement('div');el.id='popupWarn';
    el.innerHTML='팝업이 차단된 것 같아요 — 브라우저 주소창의 팝업 차단 아이콘을 눌러 허용해주세요.<br>'+
      '<button type="button" id="popupRetry">허용했어요 — 다시 열기</button>';
    document.body.appendChild(el);
    el.querySelector('#popupRetry').addEventListener('click',()=>{el.style.display='none';openPresenter();});
  }
  el.style.display='block';
  clearTimeout(window._popupWarnT);
  window._popupWarnT=setTimeout(()=>{el.style.display='none';},12000);
}
function openPresenter(){
  const url=location.pathname+location.search+'#presenter';
  let win=null;
  try{win=window.open(url,'dflPresenter','width=1320,height=840,menubar=no,toolbar=no');}catch(e){win=null;}
  if(!win||win.closed||typeof win.closed==='undefined'){showPopupWarning();}
  else{persist(i);try{win.focus();}catch(e){}}
}

/* ── 발표자 창 UI ── */
/* 현재/다음 슬라이드 박스: 부모(pStageOuter) 크기에 맞춰 정확히 16:9로 리사이즈(레터박스 제거) + 내부 클론 스케일 갱신 */
function updateStage(outerEl,stageEl,_retry){
  if(!outerEl||!stageEl)return;
  const w=outerEl.clientWidth,h=outerEl.clientHeight;
  if(w>0&&h>0){
    const s=Math.min(w/16,h/9);
    stageEl.style.width=Math.max(1,Math.floor(s*16))+'px';
    stageEl.style.height=Math.max(1,Math.floor(s*9))+'px';
  }else if(!_retry){
    /* 최초 마운트 시 부모가 아직 0×0인 경우(레이아웃 미확정) 다음 프레임에 한 번 재시도 */
    requestAnimationFrame(()=>updateStage(outerEl,stageEl,true));
    return;
  }
  const clone=stageEl.querySelector('.pDeckInnerClone');
  if(clone){
    const rect=stageEl.getBoundingClientRect();
    const scale=rect.width>0?rect.width/1600:1;
    clone.style.transform='scale('+scale+')';
  }
  if(isPresenter&&stageEl.id==='pCurrentStage')requestAnimationFrame(inkRedraw); /* [v5] 리사이즈 시 판서 다시 그리기 */
}
function cloneSlideInto(container,idx){
  container.innerHTML='';
  if(idx<0||idx>=slides.length)return;
  const clone=slides[idx].cloneNode(true);
  clone.classList.add('active');
  clone.classList.add('pDeckInnerClone');
  container.appendChild(clone);
  updateStage(container.parentElement,container);
}
/* ResizeObserver: 현재/다음 슬라이드 박스 영역이 리사이즈(드래그·창크기변경)될 때마다 transform만 갱신(성능) */
function initStageResize(){
  if(!('ResizeObserver' in window))return;
  const ro=new ResizeObserver(entries=>{
    entries.forEach(en=>{
      const outer=en.target;
      const stage=outer.querySelector('.pStage');
      if(stage)updateStage(outer,stage);
    });
  });
  const cur=document.querySelector('.pCurrentWrap .pStageOuter');
  const nxt=document.querySelector('.pNextWrap .pStageOuter');
  if(cur)ro.observe(cur);
  if(nxt)ro.observe(nxt);
}
/* [개선 18] 노트 글씨 크기 A−/A＋ (localStorage 기억) */
const NOTE_SIZE_KEY='dfl-presenter-notesize-'+DECK_ID;
function getNoteSize(){
  try{const v=parseInt(localStorage.getItem(NOTE_SIZE_KEY),10);if(v>=14&&v<=36)return v;}catch(e){}
  return 22;
}
function setNoteSize(px){
  px=Math.max(14,Math.min(36,px));
  const el=document.getElementById('pNotes');
  if(el)el.style.fontSize=px+'px';
  try{localStorage.setItem(NOTE_SIZE_KEY,String(px));}catch(e){}
}
function escHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* [개선 19] 노트 큐 자동 하이라이트: ⏰ 컷라인=주황 · ⚠️ 주의=빨강 · 백업=파랑 */
function noteHTML(note){
  return note.split('\n').map(line=>{
    const e=escHTML(line);
    if(line.indexOf('⏰')!==-1)return '<span class="pCueTime">'+e+'</span>';
    if(line.indexOf('⚠️')!==-1)return '<span class="pCueWarn">'+e+'</span>';
    if(line.indexOf('백업')!==-1)return '<span class="pCueBackup">'+e+'</span>';
    return e;
  }).join('\n');
}
function renderPresenter(){
  cloneSlideInto(document.getElementById('pCurrentStage'),i);
  /* [v5] 판서 캔버스 재부착 (cloneSlideInto가 내부를 비우므로 매 렌더마다) */
  if(pInkCanvas){document.getElementById('pCurrentStage').appendChild(pInkCanvas);requestAnimationFrame(inkRedraw);}
  const nextStage=document.getElementById('pNextStage');
  if(i+1>=TOTAL){
    /* [개선 20] 마지막 슬라이드: 빈 검정 박스 대신 안내 카드 */
    nextStage.innerHTML='<div class="pEndCard"><span style="font-size:26px;">🏁</span>마지막 슬라이드예요</div>';
    updateStage(nextStage.parentElement,nextStage);
  }else cloneSlideInto(nextStage,i+1);
  const note=NOTES[i]||'';
  const notesEl=document.getElementById('pNotes');
  if(note)notesEl.innerHTML=noteHTML(note);
  else notesEl.textContent='(이 슬라이드는 별도 노트가 없어요)';
  notesEl.classList.toggle('pEmpty',!note);
  document.getElementById('pCounter').textContent=window._counterRemain?('남은 '+(TOTAL-1-i)+'장'):(String(i+1).padStart(2,'0')+' / '+TOTAL); /* [v3-10] */
  /* [v3-16] 다음 슬라이드 노트 미리보기 */
  const nn=document.getElementById('pNextNote');
  if(nn){
    const nxt=(i+1<TOTAL)?(NOTES[i+1]||''):'';
    if(nxt){nn.style.display='block';nn.textContent='다음 노트: '+nxt.split('\n')[0].slice(0,140);}
    else nn.style.display='none';
  }
  /* [개선 21] 진행률 바 */
  const fill=document.getElementById('pProgressFill');
  if(fill)fill.style.width=((i+1)/TOTAL*100).toFixed(2)+'%';
  /* [개선 28] 창 제목에 진행 상황 — 탭/독에서 바로 보임 */
  document.title='발표자 '+(i+1)+'/'+TOTAL+' — '+DECK_TITLE;
  /* [개선 27] 처음/끝에서 이전·다음 버튼 비활성 표시 */
  const prevB=document.getElementById('pPrev'),nextB=document.getElementById('pNext');
  if(prevB)prevB.disabled=(i===0);
  if(nextB)nextB.disabled=(i===TOTAL-1);
  updateFilmstripHighlight();
}

/* ── 필름스트립 썸네일 크기: 슬라이더로 실시간 조절 + localStorage 기억 ── */
const THUMB_SIZE_KEY='dfl-presenter-thumbsize-'+DECK_ID;
function getThumbSize(){
  try{const v=parseInt(localStorage.getItem(THUMB_SIZE_KEY),10);if(v>=120&&v<=640)return v;}catch(e){}
  return 224;
}
function setThumbSize(px){
  px=Math.max(120,Math.min(640,px));
  const root=document.getElementById('presenterRoot');
  if(root)root.style.setProperty('--thumbW',px+'px');
  const scale=px/1600;
  document.querySelectorAll('#pFilmstrip .pDeckInnerClone').forEach(el=>{el.style.transform='scale('+scale+')';});
  try{localStorage.setItem(THUMB_SIZE_KEY,String(px));}catch(e){}
  scrollToCurrentThumb(false); /* [버그픽스] 리사이즈 후에도 현재 슬라이드가 화면에 고정 */
}
/* [v3-19] 필름스트립을 현재 슬라이드 위치로 */
function scrollToCurrentThumb(smooth){
  const strip=document.getElementById('pFilmstrip');
  if(!strip)return;
  const cur=strip.children[i];
  if(cur)cur.scrollIntoView({behavior:smooth?'smooth':'auto',inline:'center',block:'center'});
}
function initThumbSizeControl(){
  const range=document.getElementById('pThumbSize');
  if(!range)return;
  range.value=String(getThumbSize());
  range.addEventListener('input',()=>{setThumbSize(parseInt(range.value,10)||224);});
}
/* ── 필름스트립: 전체 96장 썸네일, 최초 1회만 클론 생성(성능) ── */
let filmstripBuilt=false;
function buildFilmstrip(){
  const strip=document.getElementById('pFilmstrip');
  if(!strip||filmstripBuilt)return;
  filmstripBuilt=true;
  function makeOne(idx){
    const scale=getThumbSize()/1600;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='pThumb';
    btn.setAttribute('aria-label','슬라이드 '+(idx+1)+'번으로 이동');
    btn.title='슬라이드 '+(idx+1)+(NOTES[idx]?' · 노트 있음':''); /* [v3-18] hover 툴팁 */
    const stage=document.createElement('div');
    stage.className='pThumbStage';
    const clone=slides[idx].cloneNode(true);
    clone.classList.add('active');
    clone.classList.add('pDeckInnerClone');
    clone.style.transform='scale('+scale+')';
    stage.appendChild(clone);
    btn.appendChild(stage);
    const num=document.createElement('span');
    num.className='pThumbNum';
    num.textContent=String(idx+1);
    btn.appendChild(num);
    /* [개선 22] 노트 있는 슬라이드에 ✎ 배지 */
    if(NOTES[idx]){
      const dot=document.createElement('span');
      dot.className='pThumbNoteDot';
      dot.title='강사 노트 있음';
      dot.textContent='✎';
      btn.appendChild(dot);
    }
    btn.addEventListener('click',()=>show(idx));
    return btn;
  }
  /* [v3-20] 96장 클론을 12장씩 나눠 생성 — 발표자 창이 즉시 뜨고 나머지는 배경에서 채움 */
  const CHUNK=12;
  function addChunk(start){
    const frag=document.createDocumentFragment();
    for(let k=start;k<Math.min(start+CHUNK,slides.length);k++)frag.appendChild(makeOne(k));
    strip.appendChild(frag);
    if(start+CHUNK<slides.length)setTimeout(()=>addChunk(start+CHUNK),0);
    else updateFilmstripHighlight();
  }
  addChunk(0);
}
function updateFilmstripHighlight(){
  const strip=document.getElementById('pFilmstrip');
  if(!strip||!filmstripBuilt)return;
  const current=strip.children[i];
  [...strip.children].forEach((btn,idx)=>btn.classList.toggle('pThumbCurrent',idx===i));
  if(current)current.scrollIntoView({behavior:'auto',inline:'center',block:'nearest'});
}
/* ── 상단(현재+다음 슬라이드) 높이: 드래그 스플리터 + 토글 버튼이 공유하는 단일 상태. localStorage 기억 ── */
const TOP_HEIGHT_KEY='dfl-presenter-toph-'+DECK_ID;
function getSavedTopHeight(){
  try{const v=parseFloat(localStorage.getItem(TOP_HEIGHT_KEY));if(v>=100&&v<=3000)return v;}catch(e){}
  return null;
}
/* pTop 높이의 상/하한을 창 실제 높이 기준으로 통일(드래그·토글이 같은 clamp 공유) */
function clampTopHeight(px,rootH){
  const min=120;
  const max=Math.max(min,(rootH||800)-260);
  return Math.max(min,Math.min(max,px));
}
function applyTopHeight(px){
  const top=document.getElementById('pTop');
  const root=document.getElementById('presenterRoot');
  if(!top)return;
  const clamped=clampTopHeight(px,root?root.clientHeight:800);
  top.style.flex='0 1 '+Math.round(clamped)+'px';
  try{localStorage.setItem(TOP_HEIGHT_KEY,String(Math.round(clamped)));}catch(e){}
}
function toggleViewMode(){
  const top=document.getElementById('pTop');
  const root=document.getElementById('presenterRoot');
  if(!top||!root)return;
  const curH=top.getBoundingClientRect().height;
  const rootH=root.clientHeight||curH*2;
  const btn=document.getElementById('pViewToggle');
  if(curH<rootH*0.4){
    applyTopHeight(Math.round(rootH*0.62));
    if(btn)btn.textContent='▸ 필름스트립 크게 보기';
  }else{
    applyTopHeight(220);
    if(btn)btn.textContent='▸ 다음 슬라이드 크게 보기';
  }
}
/* ── 상하 드래그 리사이저: 마우스/터치로 pTop 높이를 직접 조정 ── */
function initSplitter(){
  const splitter=document.getElementById('pSplitter');
  const top=document.getElementById('pTop');
  if(!splitter||!top)return;
  let dragging=false,startY=0,startH=0;
  function clientY(e){return e.touches&&e.touches.length?e.touches[0].clientY:e.clientY;}
  function onMove(e){
    if(!dragging)return;
    const dy=clientY(e)-startY;
    const root=document.getElementById('presenterRoot');
    const rootH=root?root.clientHeight:800;
    const newH=clampTopHeight(startH+dy,rootH);
    top.style.flex='0 1 '+Math.round(newH)+'px';
    e.preventDefault&&e.preventDefault();
  }
  function onUp(){
    if(!dragging)return;
    dragging=false;
    document.body.classList.remove('pSplitterDragging');
    removeEventListener('mousemove',onMove);
    removeEventListener('mouseup',onUp);
    removeEventListener('touchmove',onMove);
    removeEventListener('touchend',onUp);
    const h=top.getBoundingClientRect().height;
    try{localStorage.setItem(TOP_HEIGHT_KEY,String(Math.round(h)));}catch(e){}
  }
  function onDown(e){
    dragging=true;
    startY=clientY(e);
    startH=top.getBoundingClientRect().height;
    document.body.classList.add('pSplitterDragging');
    addEventListener('mousemove',onMove);
    addEventListener('mouseup',onUp);
    addEventListener('touchmove',onMove,{passive:false});
    addEventListener('touchend',onUp);
    e.preventDefault();
  }
  splitter.addEventListener('mousedown',onDown);
  splitter.addEventListener('touchstart',onDown,{passive:false});
}
/* ── 현재↔다음 슬라이드 폭 비율: 좌우 드래그 스플리터. localStorage 기억 ── */
const NEXT_W_KEY='dfl-presenter-nextw-'+DECK_ID;
function getSavedNextWidth(){
  try{const v=parseFloat(localStorage.getItem(NEXT_W_KEY));if(v>=100&&v<=2000)return v;}catch(e){}
  return null;
}
function clampNextWidth(px,topWidth){
  const min=140;
  const max=Math.max(min,(topWidth||900)-320);
  return Math.max(min,Math.min(max,px));
}
function applyNextWidth(px){
  const root=document.getElementById('presenterRoot');
  const top=document.getElementById('pTop');
  if(!root)return;
  const clamped=clampNextWidth(px,top?top.clientWidth:900);
  root.style.setProperty('--nextW',Math.round(clamped)+'px');
  try{localStorage.setItem(NEXT_W_KEY,String(Math.round(clamped)));}catch(e){}
}
/* pNextWrap은 flex-shrink:0(고정폭)이라 마운트 후 창 크기가 바뀌어도 저절로 줄지 않음 —
   창 리사이즈 때마다 현재 --nextW를 최신 pTop 폭 기준으로 다시 clamp해서 현재 슬라이드 박스가 눌리는 것을 방지 */
function reclampNextWidthOnResize(){
  const root=document.getElementById('presenterRoot');
  if(!root)return;
  const cur=parseFloat(getComputedStyle(root).getPropertyValue('--nextW'))||240;
  applyNextWidth(cur);
}
function initHSplitter(){
  const splitter=document.getElementById('pHSplitter');
  const nextWrap=document.getElementById('pNextWrap');
  const top=document.getElementById('pTop');
  if(!splitter||!nextWrap||!top)return;
  let dragging=false,startX=0,startW=0;
  function clientX(e){return e.touches&&e.touches.length?e.touches[0].clientX:e.clientX;}
  function onMove(e){
    if(!dragging)return;
    const dx=clientX(e)-startX;
    /* 스플리터가 next 박스 왼쪽에 있으므로 오른쪽으로 끌면(dx>0) next 폭이 줄어듦 */
    applyNextWidth(startW-dx);
    e.preventDefault&&e.preventDefault();
  }
  function onUp(){
    if(!dragging)return;
    dragging=false;
    document.body.classList.remove('pHSplitterDragging');
    removeEventListener('mousemove',onMove);
    removeEventListener('mouseup',onUp);
    removeEventListener('touchmove',onMove);
    removeEventListener('touchend',onUp);
  }
  function onDown(e){
    dragging=true;
    startX=clientX(e);
    startW=nextWrap.getBoundingClientRect().width;
    document.body.classList.add('pHSplitterDragging');
    addEventListener('mousemove',onMove);
    addEventListener('mouseup',onUp);
    addEventListener('touchmove',onMove,{passive:false});
    addEventListener('touchend',onUp);
    e.preventDefault();
  }
  splitter.addEventListener('mousedown',onDown);
  splitter.addEventListener('touchstart',onDown,{passive:false});
}
/* [개선 13~17] 타이머: 시작/일시정지 단일 토글 · 경과 유지(창 재오픈 복원) · 목표 시간·남은 시간 · 리셋 2번 확인 */
const TIMER_KEY='dfl-presenter-timer-'+DECK_ID;
let timerMs=0,timerRunning=false,timerHandle=null,timerLast=0,timerTarget=0;
function fmtTime(ms){
  const neg=ms<0;const s=Math.floor(Math.abs(ms)/1000);const m=Math.floor(s/60);const ss=s%60;
  return (neg?'-':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function saveTimer(){
  try{localStorage.setItem(TIMER_KEY,JSON.stringify({ms:timerMs,running:timerRunning,last:Date.now(),target:timerTarget}));}catch(e){}
}
function loadTimer(){
  /* [개선 14] 발표자 창을 실수로 닫아도 경과 시간이 이어짐 */
  try{
    const d=JSON.parse(localStorage.getItem(TIMER_KEY));
    if(d&&typeof d.ms==='number'){
      timerMs=d.ms;timerTarget=d.target||0;
      if(d.running&&d.last){timerMs+=Date.now()-d.last;startTimer();}
    }
  }catch(e){}
}
function updateTimerUI(){
  const disp=document.getElementById('pTimerDisplay');if(!disp)return;
  disp.textContent=fmtTime(timerMs);
  disp.classList.toggle('running',timerRunning);
  disp.classList.toggle('overrun',timerTarget>0&&timerMs>timerTarget*60000); /* [v3-13] 초과 시 펄스 */
  const btn=document.getElementById('pTimerToggle');
  if(btn){btn.textContent=timerRunning?'⏸ 일시정지':'▶ 시작';btn.classList.toggle('on',timerRunning);}
  const rem=document.getElementById('pTimerRemain');
  if(rem){
    if(timerTarget>0){
      const left=timerTarget*60000-timerMs;
      rem.style.display='inline-block';
      rem.textContent=(left<0?'초과 ':'남은 ')+fmtTime(left);
      rem.classList.toggle('over',left<0);
      rem.classList.toggle('soon',left>=0&&left<5*60000);
    }else rem.style.display='none';
  }
}
let _prevLeft=null;
function tickTimer(){
  const now=Date.now();timerMs+=now-timerLast;timerLast=now;
  if(timerTarget>0){
    const left=timerTarget*60000-timerMs;
    if(_prevLeft!==null){
      if(left<=5*60000&&_prevLeft>5*60000)edgeToast('⏳ 목표까지 5분 남았어요'); /* [v3-12] */
      if(left<=0&&_prevLeft>0)edgeToast('⏰ 목표 시간에 도달했어요'); /* [v3-11] */
    }
    _prevLeft=left;
  }
  updateTimerUI();saveTimer();
}
function startTimer(){if(timerRunning)return;timerRunning=true;timerLast=Date.now();timerHandle=setInterval(tickTimer,500);updateTimerUI();saveTimer();}
function pauseTimer(){if(!timerRunning)return;timerRunning=false;clearInterval(timerHandle);updateTimerUI();saveTimer();}
function toggleTimer(){if(timerRunning)pauseTimer();else startTimer();}
/* [개선 16] 리셋 오조작 방지 — 2.2초 안에 한 번 더 눌러야 진짜 리셋 */
let resetArmed=false,resetArmT=null;
function resetTimerPress(){
  const btn=document.getElementById('pTimerReset');
  if(!resetArmed){
    resetArmed=true;
    if(btn){btn.textContent='한 번 더 → 리셋';btn.classList.add('armed');}
    resetArmT=setTimeout(()=>{resetArmed=false;if(btn){btn.textContent='리셋';btn.classList.remove('armed');}},2200);
  }else{
    clearTimeout(resetArmT);resetArmed=false;
    if(btn){btn.textContent='리셋';btn.classList.remove('armed');}
    pauseTimer();timerMs=0;_prevLeft=null;updateTimerUI();saveTimer();
  }
}

  document.getElementById('pTimerReset').onclick=resetTimerPress;

  const tBtn=document.getElementById('pTimerTarget');
  const tInput=document.getElementById('pTargetInput');
  tBtn.onclick=()=>{
    tInput.style.display='inline-block';
    tInput.value=timerTarget||'';

  };
  function commitTarget(){
    const v=parseInt(tInput.value,10);
    timerTarget=(v>=1&&v<=600)?v:0;
    _prevLeft=null;
    tInput.style.display='none';
    updateTimerUI();saveTimer();
  }
  tInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();commitTarget();}
    else if(e.key==='Escape')tInput.style.display='none';
    e.stopPropagation();
  });
  tInput.addEventListener('blur',commitTarget);

  updateTimerUI();
}

const presenterBtnEl=document.getElementById('presenterBtn');
